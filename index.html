<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Princess Castle Academy</title>
<style>
:root{--ink:#3b1c58;--purple:#7f35c9;--lav:#ddb7ff;--gold:#fff0a8;--pink:#ffd7fa;--blue:#e9f7ff;--panel:rgba(255,255,255,.94)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;color:var(--ink);background:#eaf6ff;overscroll-behavior:none}body{overflow:hidden}button{font-family:inherit;font-weight:900;color:var(--ink);border:0;touch-action:manipulation}.hidden{display:none!important}.app{height:100dvh;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#e6f7ff,#fce9ff)}
.topbar{height:88px;flex:0 0 auto;background:rgba(238,249,255,.97);border-bottom:4px solid #b9ddfb;display:flex;align-items:center;gap:10px;padding:8px 12px}.topHome{width:56px;height:56px;border-radius:22px;border:4px solid #ddb7ff;background:linear-gradient(#fff,#fff4bd);box-shadow:0 5px 0 var(--purple);font-size:1.55rem}.title{font-size:clamp(1.05rem,3.7vw,2.35rem);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px #fff;flex:1}.stat{min-width:85px;height:56px;border-radius:32px;border:5px solid #e5bbea;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(1.15rem,3.4vw,1.9rem);font-weight:900}.portalBtn{width:58px;height:56px;border-radius:28px;border:5px solid #e5bbea;background:#fff;font-size:1.55rem}.screen{position:relative;flex:1;min-height:0;overflow:hidden;background-size:cover;background-position:center}.screen:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.10);pointer-events:none}.layer{position:relative;z-index:1;height:100%;overflow:auto;padding:12px}.btn{border-radius:24px;border:5px solid #b86bee;background:linear-gradient(#fff,#fff5bd);box-shadow:0 8px 0 var(--purple),0 12px 18px rgba(0,0,0,.12);padding:12px 18px;font-size:clamp(1rem,3vw,1.7rem)}.btn:active,.door:active,.choice:active,.chest:active,.cell:active,.num:active,.levelCard:active{transform:translateY(3px)}.bar{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:10px}.bar.three{grid-template-columns:auto auto 1fr}.barTitle{min-height:64px;border-radius:30px;border:5px solid var(--lav);background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;font-size:clamp(1.25rem,4vw,2.4rem);font-weight:900}.homePanel{min-height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px}.welcome{border-radius:34px;border:6px solid var(--lav);background:rgba(255,255,255,.92);text-align:center;padding:14px;font-size:clamp(1.3rem,4.2vw,2.8rem);font-weight:900}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-content:center}.door{min-height:120px;border-radius:26px;border:5px solid var(--lav);background:linear-gradient(#fff7d5,#ffd6f7);box-shadow:0 8px 0 var(--purple);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:clamp(1rem,2.8vw,1.55rem)}.door .emoji{font-size:2.5rem}.panel{background:var(--panel);border:6px solid var(--lav);border-radius:34px;padding:16px;box-shadow:0 10px 22px rgba(0,0,0,.11)}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.levelCard{min-height:158px;border-radius:26px;border:5px solid var(--lav);background:rgba(255,255,255,.95);box-shadow:0 8px 0 var(--purple);display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center;padding:12px;font-size:clamp(1rem,3vw,1.45rem)}.levelCard.locked{opacity:.55;filter:grayscale(1);box-shadow:0 8px 0 #aaa}.stars{color:#dfa700;letter-spacing:1px}.gameShell{height:calc(100% - 78px);min-height:0;display:flex;flex-direction:column;gap:10px}.scene{flex:1;min-height:260px;border:7px solid #fff0a6;border-radius:32px;position:relative;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 9999px rgba(255,255,255,.05)}.sceneHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.94);border:5px solid var(--lav);border-radius:24px;padding:8px 14px;font-size:clamp(1rem,3vw,1.6rem);font-weight:900;text-align:center}.spark{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.78);border:5px solid #ffd0f6;box-shadow:0 0 30px 11px rgba(238,111,210,.62);display:grid;place-items:center;z-index:3;animation:pulse 1.3s infinite}.spark:before{content:"✨";font-size:2rem}.spark.used{visibility:hidden}@keyframes pulse{50%{transform:scale(1.15)}}.dock{background:var(--panel);border:6px solid var(--lav);border-radius:30px;padding:10px;flex:0 0 auto}.chestGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}.chest{min-height:76px;border:5px solid #8a551b;border-radius:22px 22px 16px 16px;background:linear-gradient(#ffe894 0 24%,#c77b25 24% 55%,#ffd573 55%);box-shadow:0 8px 0 #71400d;display:grid;place-items:center;font-size:clamp(1.05rem,3vw,1.65rem)}.instruction{text-align:center;font-size:clamp(1rem,3vw,1.55rem);font-weight:900;margin-top:6px}.modal{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:rgba(44,25,66,.25);backdrop-filter:blur(1px)}.challenge{width:min(94%,840px);max-height:94%;overflow:auto;background:rgba(255,255,255,.97);border:7px solid #dcaeff;border-radius:34px;padding:18px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.24)}.challenge h2{font-size:clamp(1.45rem,5vw,3rem);margin:6px 0 14px}.prompt{font-size:clamp(1.25rem,4.5vw,2.7rem);font-weight:900;background:#fff;border:5px solid #e2c1ff;border-radius:28px;padding:12px;margin:8px auto 16px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices.two{grid-template-columns:repeat(2,1fr)}.choice{min-height:112px;border-radius:26px;border:5px solid #bd72ee;background:linear-gradient(#fff,#fff5ca);box-shadow:0 8px 0 var(--purple);font-size:clamp(1.1rem,3.6vw,2rem);display:grid;place-items:center;padding:10px;min-width:0}.equal .choice{height:118px}.msg{min-height:34px;font-size:clamp(1rem,3vw,1.65rem);font-weight:900;color:#8b35cc;margin-top:10px}.shake{animation:shake .35s}.hint{outline:8px solid #ffd745;animation:hint 1s infinite}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-8px)}}@keyframes hint{50%{transform:scale(1.04);filter:brightness(1.15)}}.activity{min-height:calc(100% - 78px);border:7px solid #fff0a6;border-radius:32px;padding:14px;background-size:cover;background-position:center;display:grid;place-items:center}.activity .challenge{box-shadow:none}.pictureCard{height:160px;width:100%;border-radius:22px;border:4px solid #ead0ff;background:linear-gradient(#dff7ff,#eaffdc);position:relative;overflow:hidden}.ground{position:absolute;left:0;right:0;bottom:0;height:36%;background:#c9efbd}.obj{position:absolute;font-size:4.4rem;filter:drop-shadow(0 5px 4px rgba(0,0,0,.18))}.obj.left{left:34%;top:55%;transform:translate(-50%,-50%)}.obj.right{left:68%;top:55%;transform:translate(-50%,-50%)}.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:520px;margin:10px auto}.cell{aspect-ratio:1;border:5px solid #7331bd;border-radius:17px;background:#fff;box-shadow:0 5px 0 #b166eb;display:grid;place-items:center;font-size:1.9rem}.cell.filled{background:#fff9dc}.cust{font-size:clamp(1.3rem,4vw,2.35rem);font-weight:900;display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.character{font-size:4rem}.answerNums{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:520px;margin:12px auto}.num{height:60px;border-radius:18px;border:4px solid #b86bee;background:#fff5ca;box-shadow:0 5px 0 #7f35c9;font-size:2rem}.num.selected{outline:7px solid #ffd745}.patternLine{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);font-size:clamp(2.35rem,8vw,4.6rem);margin:20px 0}.blankBox{width:clamp(66px,14vw,104px);height:clamp(66px,14vw,104px);border:6px dashed #a64de7;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.78);font-size:3rem}.calendarWrap{width:min(96%,760px)}.monthArt{border-radius:24px;border:5px solid #fff;min-height:110px;background:linear-gradient(#95dcff 0 35%,#fff3a4 36% 67%,#9bd57a 68%);display:grid;place-items:center;font-size:3.5rem;overflow:hidden}.cal{background:white;border:5px solid #c584f2;border-radius:24px;padding:9px;margin-top:8px}.cal h2{margin:0 0 5px;text-align:center;font-size:clamp(1.55rem,4.6vw,2.5rem)}.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dow{font-size:clamp(.9rem,2.7vw,1.35rem);font-weight:900}.dayCell{height:32px;border-radius:10px;background:#f7edff;display:grid;place-items:center;font-size:clamp(.85rem,2.7vw,1.35rem);font-weight:900;position:relative}.dayCell.today:after{content:'⭐';position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;opacity:.45;filter:drop-shadow(0 0 3px #b06cff);pointer-events:none}.refs{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:8px}.ref{border:3px solid #bb74ed;border-radius:14px;background:#fff;padding:6px 9px;font-weight:900}.slotRow,.tileRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.slot,.tile{width:78px;height:78px;border-radius:20px;border:5px solid #b86bee;background:#fff5ca;box-shadow:0 5px 0 #7f35c9;font-size:2rem}.speaker{border-radius:22px;border:4px solid #b86bee;background:#fff5ca;padding:8px 12px;font-size:1.5rem}.complete{position:absolute;z-index:80;inset:8%;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.97);border:8px solid #dfb0ff;border-radius:38px;padding:20px;font-size:clamp(1.5rem,5vw,3rem);font-weight:900;box-shadow:0 20px 40px rgba(0,0,0,.24)}
@media(max-width:600px){.topbar{height:88px}.portalBtn{display:none}.stat{min-width:84px}.bar{grid-template-columns:auto 1fr}.bar.three{grid-template-columns:auto 1fr}.barTitle{font-size:clamp(1.1rem,5vw,2rem)}.gameShell{height:calc(100% - 76px)}.scene{min-height:310px}.choices{gap:8px}.choice{min-height:92px;padding:6px}.pictureCard{height:136px}.activity{align-items:start}.monthArt{min-height:90px}.dayCell{height:29px}.levelCard{min-height:150px}.btn{padding:10px 14px}.layer{padding:10px}.dock{padding:8px}.chest{min-height:72px}.answerNums{grid-template-columns:repeat(5,1fr)}.num{height:54px}.cell{border-width:4px}}
</style>
</head>
<body><div class="app"><div class="topbar"><button class="topHome" onclick="showHome()">🏰</button><div class="title">Princess Castle Academy</div><div class="stat">💎 <span id="gems">0</span></div><div class="stat">🪙 <span id="coins">0</span></div><button class="portalBtn" onclick="showParent()">🔒</button></div><main id="screen" class="screen"><div id="layer" class="layer"></div></main></div>
<script>
const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];
const BG='assets/backgrounds/';
const defaultState={coins:0,gems:0,unlocked:{reading:1,rhyme:1,word:1,pattern:1,clock:1},done:{reading:{},rhyme:{},word:{},pattern:{},clock:{}}};
let state=JSON.parse(localStorage.getItem('pca-final-v4')||'null')||structuredClone(defaultState);
function save(){localStorage.setItem('pca-final-v4',JSON.stringify(state));updateTop()}function updateTop(){$('coins').textContent=state.coins;$('gems').textContent=state.gems}function addCoin(n=1){state.coins+=n;save()}function addGem(n=1){state.gems+=n;save()}function setBg(img){$('screen').style.backgroundImage=`url('${BG+img}')`}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.75;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function showHome(){setBg('home.jpg');$('layer').innerHTML=`<div class="homePanel"><div class="welcome">Choose a room in the castle</div><div class="doors"><button class="door" onclick="showLevels('clock')"><span class="emoji">🕰️</span>Clock Tower</button><button class="door" onclick="showLevels('reading')"><span class="emoji">📚</span>Reading Adventure</button><button class="door" onclick="showLevels('rhyme')"><span class="emoji">💎</span>Rhyming Treasure</button><button class="door" onclick="showLevels('word')"><span class="emoji">🔤</span>Wizard Tower</button><button class="door" onclick="startBakery()"><span class="emoji">🧁</span>Royal Bakery</button><button class="door" onclick="showLevels('pattern')"><span class="emoji">🌷</span>Pattern Garden</button><button class="door" onclick="showLevels('sight')"><span class="emoji">👑</span>Sight Word Ballroom</button></div></div>`;updateTop()}
function bar(room,title){return `<div class="bar"><button class="btn" onclick="showLevels('${room}')">⬅️ Levels</button><div class="barTitle">${title}</div></div>`}function roomTitle(r){return {reading:'📚 Reading Adventure',rhyme:'💎 Rhyming Treasure',word:'🔤 Wizard Tower',pattern:'🌷 Pattern Garden',clock:'🕰️ Clock Tower',sight:'👑 Sight Word Ballroom'}[r]}
const levels={reading:[{title:'Things I See',pages:[['I see a cat.',['cat'],[['cat'],['dog'],['pig']]],['I see a cat and a box.',['cat','box'],[['cat','box'],['dog','box'],['cat','dog']]],['I see a dog and a log.',['dog','log'],[['dog','log'],['cat','log'],['dog','box']]],['I see a pig and mud.',['pig','mud'],[['pig','mud'],['dog','mud'],['pig','log']]],['I see a bug and a hat.',['bug','hat'],[['bug','hat'],['cat','hat'],['bug','box']]]]}, {title:'More Things',pages:[['I see a dog.',['dog'],[['dog'],['cat'],['bug']]],['I see a pig and a box.',['pig','box'],[['pig','box'],['cat','box'],['pig','hat']]],['I see a cat and a hat.',['cat','hat'],[['cat','hat'],['dog','hat'],['cat','log']]],['I see a bug and a log.',['bug','log'],[['bug','log'],['pig','log'],['bug','box']]],['I see a dog and mud.',['dog','mud'],[['dog','mud'],['cat','mud'],['dog','hat']]]]}],
rhyme:[['CAT','DOG',['cat','hat','bat','rat','mat','sat','dog','log','fog','jog']],['PAN','BUG',['pan','fan','man','can','van','bug','rug','mug','hug','jug']],['HEN','SUN',['hen','pen','ten','men','den','sun','run','fun','bun']],['HOP','PIG',['hop','mop','top','cop','pop','pig','wig','dig','fig','big']],['AT','AN',['cat','hat','bat','rat','pan','man','fan','can']],['UG','OP',['bug','rug','mug','hug','hop','mop','top','pop']],['Royal Review','Mixed',['cat','fan','rug','top','pen','sun','big','mat','can','hug','mop','ten']]],
word:[{title:'-AT Family',words:['cat','hat','bat','mat','rat']},{title:'-AN Family',words:['can','fan','man','pan','van']},{title:'-OP Family',words:['hop','mop','top','pop','cop']},{title:'-IN Family',words:['pin','fin','win','tin','bin']},{title:'-UG Family',words:['bug','rug','mug','hug','jug']}],
pattern:[{title:'AB Patterns',type:'AB'},{title:'More AB',type:'AB'},{title:'ABB Patterns',type:'ABB'},{title:'AAB Patterns',type:'AAB'},{title:'ABC Patterns',type:'ABC'}],
clock:[{title:"Today's Calendar"},{title:'Days of the Week'},{title:'Months'},{title:'Seasons'}],
sight:[{title:'First Words',words:['me','he','do','go','no']},{title:'Early Words',words:['my','can','you','we','see']},{title:'More Words',words:['the','and','is','in','it']},{title:'Fun Words',words:['up','look','like','to','a']}]
};
function showLevels(room){if(room==='sight')setBg('castle-scene.png');else setBg(({reading:'reading_levels.jpg',rhyme:'rhyme.jpg',word:'word.jpg',pattern:'pattern.jpg',clock:'clock.jpg'}[room]||'home.jpg'));let arr=levels[room], unlocked=room==='sight'?99:state.unlocked[room];$('layer').innerHTML=`<div class="bar three"><button class="btn" onclick="showHome()">🏰 Home</button><div class="barTitle">${roomTitle(room)}</div></div><div class="panel"><div class="levels">${arr.map((l,i)=>{let locked=i>=unlocked;let name=Array.isArray(l)?`Level ${i+1}<br>${l[0]} vs ${l[1]}`:`Level ${i+1}<br>${l.title}`;return `<button class="levelCard ${locked?'locked':''}" ${locked?'':'onclick="startRoom(\''+room+'\','+i+')"'}><div>${locked?'🔒':roomTitle(room).split(' ')[0]}</div><div>${name}</div><div class="stars">${state.done[room]?.[i]?'⭐⭐⭐':'☆☆☆'}</div></button>`}).join('')}</div></div>`}
function startRoom(room,i){if(room==='reading')startReading(i);if(room==='rhyme')startRhyme(i);if(room==='word')startWord(i);if(room==='pattern')startPattern(i);if(room==='clock')startClock(i);if(room==='sight')startSight(i)}function complete(room,i){if(!state.done[room])state.done[room]={};state.done[room][i]=true;if(state.unlocked[room]===i+1)state.unlocked[room]++;addGem(1);$('layer').insertAdjacentHTML('beforeend',`<div class="complete"><div>🎉<br>Level Complete!<br>+1 Gem<br><button class="btn" onclick="showLevels('${room}')">Continue</button></div></div>`)}
// Sparkle games: sight + rhyme
const sparklePos=[[16,34],[31,25],[48,38],[64,27],[80,35],[22,58],[42,57],[60,58],[78,62],[18,76],[36,75],[55,76],[74,78],[88,52],[52,20]];
let sg={};function startSight(i){setBg('sight.jpg');let words=levels.sight[i].words;sg={room:'sight',i,title:levels.sight[i].title,words:[...words,...words,...words].slice(0,15),found:0,current:null,attempts:0,chests:words,bg:'castle-scene.png'};renderSparkleGame()}
function startRhyme(i){setBg('rhyme.jpg');let L=levels.rhyme[i], left=L[0], right=L[1], words=L[2];sg={room:'rhyme',i,title:`${left} vs ${right}`,words:shuffle(words),found:0,current:null,attempts:0,chests:[left,right],bg:'rhyme.jpg'};renderSparkleGame()}
function renderSparkleGame(){let total=sg.words.length;$('layer').innerHTML=bar(sg.room,`${sg.room==='sight'?'👑':'💎'} ${sg.title} &nbsp; ${sg.found}/${total}`)+`<div class="gameShell"><div class="scene" style="background-image:url('${BG+sg.bg}')">${sg.words.map((w,k)=>`<button class="spark ${k<sg.found?'used':''}" style="left:${sparklePos[k%sparklePos.length][0]}%;top:${sparklePos[k%sparklePos.length][1]}%" onclick="sparkTap(${k})"></button>`).join('')}<div class="sceneHint">Find a sparkle.</div></div><div class="dock"><div class="chestGrid">${sg.chests.map(c=>`<button class="chest" onclick="chooseSparkle('${c}')">${c}</button>`).join('')}</div><div class="instruction">Tap a sparkle. Then choose the matching chest.</div></div></div>`}
function sparkTap(k){if(k!==sg.found)return;sg.current=sg.words[k];sg.attempts=0;let prompt=sg.room==='sight'?`Find this word:<br><span style="font-size:1.35em">${sg.current}</span>`:`Which chest rhymes with:<br><button class="speaker" onclick="speak('${sg.current}')">🔊 ${sg.current}</button>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="sparkModal"><div class="challenge"><h2>${prompt}</h2><div class="choices ${sg.chests.length===2?'two':''}">${sg.chests.map(c=>`<button class="choice" onclick="chooseSparkle('${c}')">${c}</button>`).join('')}</div><div class="msg" id="sparkMsg"></div></div></div>`);if(sg.room==='rhyme')speak(sg.current)}
function familyOf(w){let map={cat:'CAT',hat:'CAT',bat:'CAT',rat:'CAT',mat:'CAT',sat:'CAT',dog:'DOG',log:'DOG',fog:'DOG',jog:'DOG',pan:'PAN',fan:'PAN',man:'PAN',can:'PAN',van:'PAN',bug:'BUG',rug:'BUG',mug:'BUG',hug:'BUG',jug:'BUG',hen:'HEN',pen:'HEN',ten:'HEN',men:'HEN',den:'HEN',sun:'SUN',run:'SUN',fun:'SUN',bun:'SUN',hop:'HOP',mop:'HOP',top:'HOP',cop:'HOP',pop:'HOP',pig:'PIG',wig:'PIG',dig:'PIG',fig:'PIG',big:'PIG'};return map[w]||w.toUpperCase()}
function chooseSparkle(c){if(!sg.current)return;let ok=sg.room==='sight'?c.toLowerCase()===sg.current.toLowerCase():(c===familyOf(sg.current)||c===sg.current.toUpperCase());if(ok){addCoin(1);document.getElementById('sparkModal')?.remove();sg.current=null;sg.found++;if(sg.found>=sg.words.length)complete(sg.room,sg.i);else renderSparkleGame()}else{sg.attempts++;let m=$('sparkMsg');if(m)m.textContent=sg.attempts>=2?'Listen and try the other chest.':'Try again!';if(sg.attempts>=3){$$('.choice').forEach(b=>{let txt=b.textContent.trim();if((sg.room==='sight'&&txt.toLowerCase()===sg.current.toLowerCase())||(sg.room==='rhyme'&&txt===familyOf(sg.current)))b.classList.add('hint')})}}}
// Reading
const iconMap={cat:'🐱',dog:'🐶',pig:'🐷',bug:'🐞',box:'📦',log:'🪵',mud:'🟤',hat:'🎩'};let read={};function startReading(i){setBg('reading.jpg');read={i,q:0,attempts:0,pages:levels.reading[i].pages};renderReading()}
function picHTML(items){return `<div class="pictureCard"><div class="ground"></div>${items.map((it,j)=>`<span class="obj ${j?'right':'left'}">${iconMap[it]||it}</span>`).join('')}</div>`}
function renderReading(){let p=read.pages[read.q];$('layer').innerHTML=bar('reading',`📚 ${levels.reading[read.i].title} &nbsp; ${read.q+1}/${read.pages.length}`)+`<div class="activity" style="background-image:url('${BG+'reading.jpg'}')"><div class="challenge"><div class="prompt">${p[0]}</div><div class="choices equal">${shuffle(p[2]).map((items,idx)=>`<button class="choice" id="read${idx}" onclick='chooseReading(${JSON.stringify(items)},${idx})'>${picHTML(items)}</button>`).join('')}</div><div class="msg" id="readMsg"></div></div></div>`}
function arrEq(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}function chooseReading(items,idx){let ans=read.pages[read.q][1];if(arrEq(items,ans)){addCoin(1);read.q++;if(read.q>=read.pages.length)complete('reading',read.i);else renderReading()}else{read.attempts++;$('readMsg').textContent=read.attempts>=2?'Look for BOTH things in the sentence.':'Try again!';let b=$('read'+idx);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(read.attempts>=3)$$('.choice').forEach(c=>{if(c.textContent.includes((iconMap[ans[0]]||ans[0])))c.classList.add('hint')})}}
// Bakery continuous
let bak={};const customers=[['🐉','dragon','🧁'],['🐱','castle cat','🐟'],['🧙‍♂️','wizard','🫐'],['🦄','unicorn','🍎'],['🐰','bunny','🥕'],['🐸','frog prince','🍪'],['🐲','baby dragon','🍬']];function startBakery(){setBg('bakery.jpg');bak={served:0};newOrder()}function newOrder(){let c=customers[Math.floor(Math.random()*customers.length)],a=Math.floor(Math.random()*5)+1,b=Math.floor(Math.random()*(10-a))+1;bak={...bak,char:c[0],name:c[1],item:c[2],a,b,stage:'first',filled:Array(10).fill(''),selected:null,attempts:0};renderBakery()}
function renderBakery(){let target=bak.stage==='first'?bak.a:bak.b;let label=bak.stage==='first'?`${bak.char} The ${bak.name} wants ${bak.a} ${bak.item}`:bak.stage==='second'?`${bak.char} The ${bak.name} wants ${bak.b} more ${bak.item}`:`${bak.char} How many ${bak.item} altogether?`;let btn=bak.stage==='answer'?'✨ Check Answer':'🔔 Serve Order';$('layer').innerHTML=`<div class="bar"><button class="btn" onclick="showHome()">🏰 Home</button><div class="barTitle">🧁 Royal Bakery &nbsp; Orders: ${bak.served}</div></div><div class="activity" style="background-image:url('${BG+'bakery.jpg'}')"><div class="challenge"><div class="cust"><span class="character">${bak.char}</span><span>${label}</span></div><div class="tenframe">${bak.filled.map((x,i)=>`<button class="cell ${x?'filled':''}" onclick="toggleCell(${i})">${x}</button>`).join('')}</div>${bak.stage==='answer'?`<div class="prompt">${bak.a} + ${bak.b} = ?</div><div class="answerNums">${answerChoices(bak.a+bak.b).map(n=>`<button class="num ${bak.selected===n?'selected':''}" onclick="bak.selected=${n};renderBakery()">${n}</button>`).join('')}</div>`:''}<button class="btn" onclick="bakSubmit()">${btn}</button><div class="msg" id="bakMsg"></div></div></div>`}
function toggleCell(i){if(bak.stage==='answer')return;if(bak.filled[i])bak.filled[i]='';else bak.filled[i]=bak.item;renderBakery()}function filledCount(){return bak.filled.filter(Boolean).length}function bakSubmit(){if(bak.stage==='first'){if(filledCount()===bak.a){bak.stage='second';bak.attempts=0;renderBakery()}else bakWrong(`Count ${bak.a}, then serve.`)}else if(bak.stage==='second'){if(filledCount()===bak.a+bak.b){bak.stage='answer';bak.attempts=0;bak.selected=null;renderBakery()}else bakWrong(`Add ${bak.b} more. Then serve.`)}else{if(bak.selected===bak.a+bak.b){addCoin(1);bak.served++;if(bak.served%5===0)addGem(1);document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="challenge"><h2>🎉 Great job!</h2><div class="prompt">${bak.a} + ${bak.b} = ${bak.a+bak.b}</div><button class="btn" onclick="this.closest('.modal').remove();newOrder()">Next Order</button></div></div>`)}else bakWrong('Choose the total, then check your answer.')}}function bakWrong(m){bak.attempts++;$('bakMsg').textContent=bak.attempts>=2?m:'Try again!';document.querySelector('.challenge').classList.add('shake');setTimeout(()=>document.querySelector('.challenge')?.classList.remove('shake'),400)}function answerChoices(ans){let set=new Set([ans]);while(set.size<10)set.add(Math.floor(Math.random()*10)+1);return shuffle([...set])}
// Pattern
let pat={};const pats=[['💎','🌻','🌷'],['🌷','🦋','🍄'],['🌼','🐞','💎'],['🍄','🌻','🦋'],['🌷','💎','🌼']];function startPattern(i){setBg('pattern.jpg');pat={i,q:0,attempts:0,qs:makePatterns(levels.pattern[i].type)};renderPattern()}function makePatterns(type){return shuffle(pats).map((objs,idx)=>{let [A,B,C]=objs,seq,ans;if(type==='AB'){seq=[A,B,A,B];ans=A}else if(type==='ABB'){seq=[A,B,B,A,B,B];ans=A}else if(type==='AAB'){seq=[A,A,B,A,A];ans=B}else{seq=[A,B,C,A,B];ans=C}return {seq,ans,choices:shuffle([ans, ans===A?B:A, C])}}).slice(0,5)}function renderPattern(){let q=pat.qs[pat.q];$('layer').innerHTML=bar('pattern',`🌷 ${levels.pattern[pat.i].title} &nbsp; ${pat.q+1}/${pat.qs.length}`)+`<div class="activity" style="background-image:url('${BG+'pattern.jpg'}')"><div class="challenge"><h2>Fix the flower bed.</h2><div class="patternLine">${q.seq.map(x=>`<span>${x}</span>`).join('')}<span class="blankBox">?</span></div><div class="choices equal">${q.choices.map((c,i)=>`<button class="choice" id="pat${i}" onclick="choosePattern('${c}',${i})">${c}</button>`).join('')}</div><div class="msg" id="patMsg"></div></div></div>`}function choosePattern(c,i){let q=pat.qs[pat.q];if(c===q.ans){addCoin(1);pat.q++;if(pat.q>=pat.qs.length)complete('pattern',pat.i);else renderPattern()}else{pat.attempts++;$('patMsg').textContent=pat.attempts>=2?'Look at what repeats.':'Try again!';$('pat'+i).classList.add('shake');setTimeout(()=>$('pat'+i)?.classList.remove('shake'),400);if(pat.attempts>=3)$$('.choice').forEach(b=>{if(b.textContent.trim()===q.ans)b.classList.add('hint')})}}
// Word builder
let wb={};const wordPics={cat:'🐱',hat:'🎩',bat:'🦇',mat:'▭',rat:'🐀',can:'🥫',fan:'🪭',man:'👨',pan:'🍳',van:'🚐',hop:'🐰',mop:'🧹',top:'🔝',pop:'🎈',cop:'👮',pin:'📌',fin:'🐟',win:'🏆',tin:'🥫',bin:'🗑️',bug:'🐞',rug:'▭',mug:'☕',hug:'🤗',jug:'🏺'};function startWord(i){setBg('word.jpg');wb={i,q:0,words:levels.word[i].words,slots:['','',''],tiles:[],attempts:0};nextWord()}function nextWord(){wb.word=wb.words[wb.q];wb.slots=['','',''];wb.tiles=shuffle(wb.word.toUpperCase().split(''));wb.attempts=0;renderWord()}function renderWord(){$('layer').innerHTML=bar('word',`🔤 ${levels.word[wb.i].title} &nbsp; ${wb.q+1}/${wb.words.length}`)+`<div class="activity" style="background-image:url('${BG+'word.jpg'}')"><div class="challenge"><button class="speaker" onclick="speak('${wb.word}')">🔊 Say Word</button><h2>${wordPics[wb.word]||'✨'}</h2><div class="slotRow">${wb.slots.map((s,i)=>`<button class="slot" onclick="removeLetter(${i})">${s}</button>`).join('')}</div><div class="tileRow">${wb.tiles.map((t,i)=>`<button class="tile" onclick="addLetter(${i})">${t}</button>`).join('')}</div><div class="msg" id="wordMsg"></div></div></div>`}function addLetter(i){let e=wb.slots.indexOf('');if(e<0)return;wb.slots[e]=wb.tiles.splice(i,1)[0];renderWord();if(!wb.slots.includes(''))setTimeout(checkWord,150)}function removeLetter(i){if(wb.slots[i]){wb.tiles.push(wb.slots[i]);wb.slots[i]='';renderWord()}}function checkWord(){if(wb.slots.join('').toLowerCase()===wb.word){addCoin(1);wb.q++;if(wb.q>=wb.words.length)complete('word',wb.i);else nextWord()}else{wb.attempts++;$('wordMsg').textContent=wb.attempts>=2?'Try moving the letters.':'Try again!';document.querySelector('.slotRow').classList.add('shake');setTimeout(()=>document.querySelector('.slotRow')?.classList.remove('shake'),400)}}
// Clock
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], months=['January','February','March','April','May','June','July','August','September','October','November','December'];let clk={};function info(){let d=new Date();return {d,day:days[d.getDay()],tom:days[(d.getDay()+1)%7],yes:days[(d.getDay()+6)%7],mon:months[d.getMonth()],prevMon:months[(d.getMonth()+11)%12],nextMon:months[(d.getMonth()+1)%12],date:d.getDate(),year:d.getFullYear()}}function startClock(i){setBg('clock.jpg');clk={i,q:0,attempts:0,qs:makeClock(i)};renderClock()}function makeClock(i){let x=info();if(i===0)return [['Today is...',x.day,[x.day,x.tom,x.yes]],['Tomorrow is...',x.tom,[x.tom,x.day,x.yes]],['Yesterday was...',x.yes,[x.yes,x.day,x.tom]],['The month is...',x.mon,[x.mon,x.nextMon,x.prevMon]],['The date is...',String(x.date),[String(x.date),String(x.date+1),String(Math.max(1,x.date-1))]],['The year is...',String(x.year),[String(x.year),String(x.year-1),String(x.year+1)]]];if(i===1){let qs=[];days.forEach((d,k)=>{qs.push([`If today is ${d}, tomorrow is...`,days[(k+1)%7],[days[(k+1)%7],d,days[(k+6)%7]]);qs.push([`If today is ${d}, yesterday was...`,days[(k+6)%7],[days[(k+6)%7],d,days[(k+1)%7]])});return shuffle(qs).slice(0,8)}if(i===2){let qs=[];months.forEach((m,k)=>{qs.push([`After ${m} comes...`,months[(k+1)%12],[months[(k+1)%12],m,months[(k+11)%12]]);qs.push([`Before ${m} was...`,months[(k+11)%12],[months[(k+11)%12],m,months[(k+1)%12]])});return shuffle(qs).slice(0,8)}return [['Summer is...','hot',['hot','cold','snowy']],['Winter is...','cold',['cold','hot','sunny']],['In summer we wear...','bathing suits',['bathing suits','coats','mittens']],['In winter we wear...','coats',['coats','bathing suits','shorts']],['Pumpkins remind us of...','Fall',['Fall','Summer','Winter']],['Flowers bloom in...','Spring',['Spring','Winter','Fall']]]}
function calHTML(){let x=info(),d=x.d,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),labels=['S','M','Tu','W','Th','F','S'];let cells=labels.map(l=>`<div class="dow">${l}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=last;n++)cells+=`<div class="dayCell ${n===x.date?'today':''}">${n}</div>`;return `<div class="calendarWrap"><div class="monthArt">${monthEmoji(m)}</div><div class="cal"><h2>${x.mon} ${y}</h2><div class="calGrid">${cells}</div></div></div>`}function monthEmoji(m){return ['❄️☃️','💘❄️','🌷☔','🌦️🌸','🌼🦋','☀️🏰🌷','🎆☀️','🏖️☀️','🍎📚','🎃🍂','🦃🍁','🎄❄️'][m]}function refHTML(i){if(i===0)return calHTML();if(i===1)return `<div class="refs">${days.map(d=>`<span class="ref">${d}</span>`).join('')}</div>`;if(i===2)return `<div class="refs">${months.map(m=>`<span class="ref">${m}</span>`).join('')}</div>`;let p=clk.qs[clk.q][0];return `<div class="monthArt">${p.includes('summer')||p.includes('Summer')?'☀️🏖️':p.includes('winter')||p.includes('Winter')?'❄️🧥':p.includes('Pumpkins')?'🎃🍂':'🌸🌷'}</div>`}
function renderClock(){let [prompt,ans,ch]=clk.qs[clk.q];$('layer').innerHTML=bar('clock',`🕰️ ${levels.clock[clk.i].title} &nbsp; ${clk.q+1}/${clk.qs.length}`)+`<div class="activity" style="background-image:url('${BG+'clock.jpg'}')"><div class="challenge" style="width:min(94%,780px)">${refHTML(clk.i)}<div class="prompt">${prompt}</div><div class="choices equal">${shuffle(ch).map((c,i)=>`<button class="choice" id="clock${i}" onclick="chooseClock('${c.replace(/'/g,"\\'")}','${ans.replace(/'/g,"\\'")}',${i})">${c}</button>`).join('')}</div><div class="msg" id="clockMsg"></div></div></div>`}function chooseClock(c,ans,i){if(c===ans){addCoin(1);clk.q++;if(clk.q>=clk.qs.length)complete('clock',clk.i);else renderClock()}else{clk.attempts++;$('clockMsg').textContent=clk.attempts>=2?'Use the clue on the screen.':'Try again!';$('clock'+i).classList.add('shake');setTimeout(()=>$('clock'+i)?.classList.remove('shake'),400);if(clk.attempts>=3)$$('.choice').forEach(b=>{if(b.textContent.trim()===ans)b.classList.add('hint')})}}
function showParent(){let code=prompt('Enter Parent Portal Code');if(code!=='0000')return alert('Incorrect code');setBg('home.jpg');$('layer').innerHTML=`<div class="panel"><h1>Parent Portal</h1><p>Code: 0000</p><button class="btn" onclick="state=structuredClone(defaultState);save();showHome()">Reset Progress</button> <button class="btn" onclick="Object.keys(state.unlocked).forEach(k=>state.unlocked[k]=99);save();showHome()">Unlock All Levels</button> <button class="btn" onclick="showHome()">Back</button></div>`}
showHome();updateTop();
</script></body></html>
