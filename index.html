<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Princess Castle Academy</title>
<style>
*{box-sizing:border-box} :root{--navy:#3c1f5c;--purple:#7b2fc6;--lav:#d8b8ff;--pink:#e358c8;--gold:#ffe28a;--cream:#fffaf0;--green:#278650}
html,body{margin:0;height:100%;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;color:var(--navy);background:#dff1ff;overscroll-behavior:none}body{overflow:hidden}.app{height:100dvh;max-width:1180px;margin:0 auto;padding:6px;display:flex;flex-direction:column;gap:6px}.hidden{display:none!important}button{font-family:inherit;font-weight:900;color:var(--navy);border:0;border-radius:18px;padding:10px 14px;background:linear-gradient(#fff,#fff5c8);box-shadow:0 7px 0 #7a30c4,0 10px 16px rgba(0,0,0,.12);border:4px solid #bd74f3;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 4px 0 #7a30c4}.top{flex:0 0 auto;background:rgba(238,249,255,.96);border-bottom:3px solid #b7dcff;border-radius:0 0 18px 18px;padding:8px;display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}.title{font-size:clamp(1.1rem,4vw,2.4rem);font-weight:900;text-shadow:0 2px white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{background:rgba(255,255,255,.92);border:4px solid #e9c8ef;border-radius:28px;padding:8px 14px;font-size:clamp(1rem,3vw,1.6rem);font-weight:900}.iconbtn{min-width:74px;font-size:1.6rem;padding:8px 12px}.screen{flex:1 1 auto;min-height:0;border-radius:24px;overflow:hidden;border:5px solid rgba(255,255,255,.75);box-shadow:0 10px 22px rgba(0,0,0,.18);position:relative;background-size:cover;background-position:center}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.16));pointer-events:none}.overlay{position:relative;z-index:2;height:100%;overflow:auto;padding:14px}.home-grid{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px}.welcome{background:rgba(255,255,255,.92);border:4px solid #e5c3ff;border-radius:24px;padding:12px;text-align:center;font-size:clamp(1.3rem,3.8vw,2.8rem);font-weight:900}.door-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:center}.door{min-height:120px;background:linear-gradient(#fff7c9,#ffccf2);font-size:clamp(1rem,2.6vw,1.5rem);display:flex;flex-direction:column;align-items:center;justify-content:center}.door .emoji{font-size:2.4rem}.panel{background:rgba(255,255,255,.94);border:5px solid #dec5f7;border-radius:26px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.13)}.roombar{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:10px}.roomtitle{text-align:center;font-size:clamp(1.25rem,3.8vw,2.4rem);font-weight:900}.level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.level-card{text-align:center;min-height:155px;display:flex;flex-direction:column;justify-content:space-between}.level-card.locked{opacity:.55;filter:grayscale(1)}.play-area{height:calc(100% - 84px);min-height:0;display:flex;flex-direction:column;gap:8px}.scene-play{flex:1;min-height:0;position:relative;border-radius:24px;overflow:hidden;background-size:cover;background-position:center;border:5px solid #fff8c9}.scene-play:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.15);pointer-events:none}.bottom-dock{flex:0 0 auto;background:rgba(255,255,255,.94);border:4px solid #e4c5ff;border-radius:22px;padding:8px}.hotspot{position:absolute;z-index:5;background:transparent;border:0;box-shadow:none;padding:0;border-radius:50%}.hotspot:active{transform:none;box-shadow:none}.marker{position:absolute;z-index:4;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);border:3px solid #ffd6f6;box-shadow:0 0 18px #e358c8;font-size:1.25rem;animation:pulse 1.2s infinite}.obj{position:absolute;z-index:3;transform:translate(-50%,-50%);font-size:clamp(1.8rem,5vw,3.6rem);filter:drop-shadow(0 5px 4px rgba(0,0,0,.2))}@keyframes pulse{50%{transform:scale(1.2)}}.coin-pop{position:absolute;left:12px;bottom:12px;z-index:9;background:rgba(255,255,255,.96);border:4px solid #d8a2ff;border-radius:20px;padding:10px;text-align:center;min-width:140px;box-shadow:0 12px 24px rgba(0,0,0,.25)}.coin-word{font-size:2rem;background:radial-gradient(#fff,#f0c0ff);border:5px solid #8e43ce;border-radius:50%;width:105px;height:105px;display:grid;place-items:center;margin:auto;font-weight:900}.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.chest{min-height:72px;background:linear-gradient(#ffe393 0 25%,#c17a22 25% 55%,#ffd071 55%);border:4px solid #8b540e;border-radius:20px 20px 14px 14px;box-shadow:0 6px 0 #744008;color:#3b1d59;font-size:1.1rem}.sparkle{position:absolute;z-index:12;font-size:2.7rem;animation:pop .8s forwards}@keyframes pop{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.4);opacity:1}100%{transform:scale(.8);opacity:0}}.shake{animation:shake .35s}.hint{outline:8px solid #ffd84a!important;animation:hint 1s infinite}.softHint{animation:hint 1s infinite}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-8px)}}@keyframes hint{50%{filter:brightness(1.2);transform:scale(1.04)}}.prompt-card{background:rgba(255,255,255,.95);border:5px solid #e3c4ff;border-radius:24px;padding:14px;text-align:center;font-size:clamp(1.25rem,4vw,2.5rem);font-weight:900}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.choice{min-height:110px;font-size:clamp(1.1rem,4vw,2rem)}.mini-scene{height:120px;border-radius:18px;background:linear-gradient(#dff8ff,#e7ffe3);position:relative;overflow:hidden;border:3px solid #efd6ff}.animal{position:absolute;font-size:3.6rem;left:50%;top:58%;transform:translate(-50%,-50%)}.animal.hop{top:43%;animation:bounce .9s infinite}.animal.sleep:after{content:'💤';position:absolute;font-size:1.8rem;left:55%;top:-18px}.log{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:80px;height:24px;background:#9b5b24;border-radius:18px;border:3px solid #6b3b14}.box{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:78px;height:50px;background:#d99645;border:4px solid #8e5526;border-radius:8px}.mud{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:100px;height:30px;background:#8b5a37;border-radius:50%}@keyframes bounce{50%{transform:translate(-50%,-66%)}}.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:14px auto}.cell{aspect-ratio:1;border:5px solid #7c2fc8;border-radius:18px;background:white;display:grid;place-items:center;font-size:2rem;box-shadow:0 5px 0 #b96bf0}.dragon-row{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(1.4rem,4vw,2.8rem);font-weight:900}.dragon{font-size:4rem}.calendar-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.month-art{border-radius:20px;min-height:130px;background:linear-gradient(#87d9ff,#fff7aa 65%,#8ed36e);display:grid;place-items:center;font-size:4rem;border:4px solid #fff}.cal{background:white;border:4px solid #c68cff;border-radius:18px;padding:8px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.daycell{min-height:32px;border-radius:8px;display:grid;place-items:center;background:#f9f1ff;font-weight:900;position:relative}.daycell.today:after{content:'⭐';position:absolute;inset:-11px 0 auto auto;font-size:1.35rem}.reference-strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.refpill{background:white;border:3px solid #bc74f2;border-radius:14px;padding:6px 9px;font-weight:900}.pattern-row{display:flex;gap:14px;align-items:center;justify-content:center;font-size:3rem;margin:18px 0}.blank{border:5px dashed #a855e8;border-radius:16px;width:70px;height:70px;display:grid;place-items:center;background:rgba(255,255,255,.8)}.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.slot,.tile{width:74px;height:74px;border-radius:18px;border:5px solid #8b39d2;background:white;display:grid;place-items:center;font-size:2.3rem;font-weight:900;box-shadow:0 5px 0 #b86bf0}.tile{background:#fff6c4}.slot-row{display:flex;gap:10px;justify-content:center;margin:12px}.msg{text-align:center;font-size:clamp(1.1rem,3.5vw,2rem);font-weight:900;min-height:40px}.complete{position:absolute;z-index:40;inset:8%;background:rgba(255,255,255,.96);border:6px solid #e1b2ff;border-radius:30px;display:grid;place-items:center;text-align:center;padding:18px;font-size:2rem;font-weight:900;box-shadow:0 14px 30px rgba(0,0,0,.25)}
@media(max-width:650px){.app{padding:0}.top{border-radius:0;grid-template-columns:1fr auto auto}.iconbtn{min-width:62px}.top .lock{display:none}.screen{border-radius:0;border-left:0;border-right:0}.overlay{padding:10px}.choice-grid{gap:8px}.choice{padding:8px;min-height:96px}.calendar-wrap{grid-template-columns:1fr}.roombar{grid-template-columns:auto 1fr}.roombar .pill{display:none}.door-grid{grid-template-columns:repeat(2,1fr)}.door{min-height:115px}.chests{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body><div class="app">
<header class="top"><div class="title">🏰 Princess Castle Academy</div><div class="pill">💎 <span id="gems">0</span></div><div class="pill">🪙 <span id="coins">0</span></div><button class="iconbtn lock" onclick="showParent()">🔒</button></header>
<main id="screen" class="screen" style="background-image:url('assets/backgrounds/home.jpg')"><div id="overlay" class="overlay"></div></main>
</div><script>
const $=id=>document.getElementById(id);const bg=n=>`url('assets/backgrounds/${n}.jpg')`;const STORE='princessCastleAcademyRebuiltV2';
const rooms={clock:{name:'Clock Tower',icon:'🕰️',bg:'clock'},reading:{name:'Reading Adventure',icon:'📚',bg:'reading'},rhyme:{name:'Rhyming Treasure',icon:'💎',bg:'rhyme'},word:{name:'Wizard Tower',icon:'🪄',bg:'word'},bakery:{name:'Royal Bakery',icon:'🧁',bg:'bakery'},pattern:{name:'Pattern Garden',icon:'🌷',bg:'pattern'},sight:{name:'Sight Word Ballroom',icon:'👑',bg:'sight'}};
const defaultProgress={coins:0,gems:0,unlocked:{clock:0,reading:0,rhyme:0,word:0,pattern:0,sight:0},done:{}};let state=load();function load(){try{return {...defaultProgress,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return structuredClone(defaultProgress)}}function save(){localStorage.setItem(STORE,JSON.stringify(state));updateTop()}function updateTop(){$('gems').textContent=state.gems||0;$('coins').textContent=state.coins||0}function setBg(name){$('screen').style.backgroundImage=bg(name)}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.75;u.pitch=1;speechSynthesis.speak(u)}function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function addCoin(n=1){state.coins=(state.coins||0)+n;save()}function addGem(n=1){state.gems=(state.gems||0)+n;save()}function roomComplete(room,idx){let key=room+':'+idx;if(!state.done[key]){state.done[key]=true;addGem(1)}if(state.unlocked[room]===idx)state.unlocked[room]=idx+1;save();showComplete('Level Complete!','+1 Gem 💎',()=>showLevels(room))}
function showHome(){setBg('home');$('overlay').innerHTML=`<div class="home-grid"><div class="welcome">Choose a castle room</div><div class="door-grid">${Object.entries(rooms).map(([k,r])=>`<button class="door" onclick="${k==='bakery'?'startBakery()':`showLevels('${k}')`}"><div class="emoji">${r.icon}</div><div>${r.name}</div><small>Level ${(state.unlocked[k]||0)+1}</small></button>`).join('')}</div></div>`;updateTop()}
function bar(room,title,count=''){let r=rooms[room];return `<div class="roombar"><button onclick="showHome()">🏰 Home</button><div class="panel roomtitle">${r.icon} ${title}</div><div class="pill">${count}</div></div>`}
function showLevels(room){let r=rooms[room];setBg(r.bg);let data=levelData[room];$('overlay').innerHTML=bar(room,r.name)+`<div class="panel"><div class="level-grid">${data.map((l,i)=>{let lock=i>(state.unlocked[room]||0),done=state.done[room+':'+i];return `<div class="panel level-card ${lock?'locked':''}"><h2>${done?'⭐ ':''}${i+1}</h2><h3>${l.title}</h3><p>${l.desc||''}</p><button ${lock?'disabled':''} onclick="startLevel('${room}',${i})">${lock?'Locked':'Play'}</button></div>`}).join('')}</div></div>`}
const levelData={
clock:[{title:"Today's Calendar",desc:'Use a calendar to find today, tomorrow, and yesterday.'},{title:'Days of the Week',desc:'Before and after days.'},{title:'Months',desc:'Before and after months.'},{title:'Seasons',desc:'Weather and clothes.'}],
reading:[{title:'The Cat'},{title:'The Dog'},{title:'The Pig'},{title:'Mixed Stories'}],
rhyme:[{title:'CAT vs DOG',groups:{cat:['hat','bat','mat','rat','sat'],dog:['log','jog','hog','fog']}},{title:'PAN vs BUG',groups:{pan:['fan','man','van','can'],bug:['rug','mug','hug','tug']}},{title:'SUN vs HEN',groups:{sun:['fun','run','bun'],hen:['ten','pen','men']}}],
word:[{title:'-AT Family',words:['cat','hat','bat','mat','rat']},{title:'-AN Family',words:['can','fan','man','pan','van']},{title:'-OP Family',words:['hop','mop','top','pop','cop']},{title:'-IN Family',words:['pin','fin','win','tin','bin']}],
pattern:[{title:'AB Patterns',type:'AB'},{title:'AAB Patterns',type:'AAB'},{title:'ABB Patterns',type:'ABB'},{title:'ABC Patterns',type:'ABC'}],
sight:[{title:'First Words',words:['me','he','do','go','no']},{title:'Early Words',words:['my','can','you','we','see']},{title:'-at Family',words:['cat','bat','sat','mat','hat']},{title:'Core Sight Words',words:['the','and','for','was','are']}]
};
function startLevel(room,i){if(room==='clock')return startClock(i);if(room==='reading')return startReading(i);if(room==='rhyme')return startRhyme(i);if(room==='word')return startWord(i);if(room==='pattern')return startPattern(i);if(room==='sight')return startSight(i)}
function showComplete(t,sub,cb){let d=document.createElement('div');d.className='complete';d.innerHTML=`<div><div style="font-size:4rem">🎉</div><div>${t}</div><p>${sub}</p><button id="okDone">Continue</button></div>`;$('screen').appendChild(d);$('okDone').onclick=()=>{d.remove();cb&&cb()}}
// shared hidden-object mechanics
const hotspots=[{x:8,y:55,w:8,h:12,icon:'💎'},{x:20,y:50,w:8,h:12,icon:'👑'},{x:33,y:59,w:8,h:12,icon:'🦄'},{x:46,y:43,w:8,h:12,icon:'🌟'},{x:58,y:53,w:8,h:12,icon:'🎀'},{x:72,y:57,w:8,h:12,icon:'🪄'},{x:84,y:67,w:8,h:12,icon:'🐉'},{x:65,y:77,w:8,h:12,icon:'🌹'},{x:50,y:80,w:8,h:12,icon:'🔮'},{x:31,y:76,w:8,h:12,icon:'🗝️'},{x:15,y:77,w:8,h:12,icon:'✨'},{x:88,y:37,w:7,h:10,icon:'🏳️'},{x:40,y:30,w:8,h:10,icon:'🦋'},{x:25,y:35,w:8,h:10,icon:'💐'},{x:74,y:32,w:8,h:10,icon:'🧵'}];
let hunt={};function initHunt(room,bgname,title,items,labels,completeCb){setBg(bgname);hunt={room,title,items:shuffle(items.map(x=>({...x,sorted:false}))),labels,active:null,done:0,completeCb,attempts:0};renderHunt()}
function renderHunt(){let total=hunt.items.length,done=hunt.items.filter(i=>i.sorted).length;$('overlay').innerHTML=bar(hunt.room,hunt.title,`${done} / ${total}`)+`<div class="play-area"><div class="scene-play" id="playScene" style="background-image:${bg(rooms[hunt.room].bg)}"><div id="objects"></div><div id="markers"></div><div id="coinPop" class="coin-pop hidden"><div class="coin-word" id="coinWord"></div><button onclick="hunt.active&&speak(hunt.active.word)">🔊</button></div></div><div class="bottom-dock"><div class="chests">${hunt.labels.map(l=>`<button class="chest" id="chest-${l}" onclick="chooseHunt('${l}')">${esc(l.toUpperCase())}<div style="font-size:.9rem">${'⭐'.repeat(hunt.items.filter(i=>i.sorted&&i.answer===l).length)}</div></button>`).join('')}</div><div class="msg" id="huntMsg">Find a sparkle. Then choose the matching chest.</div></div></div>`;renderHuntObjects()}
function renderHuntObjects(){let o=$('objects'),m=$('markers');o.innerHTML='';m.innerHTML='';hunt.items.forEach((it,i)=>{if(it.sorted)return;let p=hotspots[i%hotspots.length];o.innerHTML+=`<div class="obj" style="left:${p.x+p.w/2}%;top:${p.y+p.h/2}%">${p.icon}</div>`;m.innerHTML+=`<div class="marker" style="left:${p.x+p.w/2}%;top:${p.y+p.h/2}%">✨</div><button class="hotspot" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%" onclick="revealHunt(${i})"></button>`})}
function revealHunt(i){let it=hunt.items[i];if(!it||it.sorted)return;hunt.active={...it,index:i};hunt.attempts=0;$('coinWord').textContent=it.word;$('coinPop').classList.remove('hidden');$('huntMsg').textContent='Which chest does it belong in?';if(hunt.room==='rhyme')speak(it.word)}function chooseHunt(label){if(!hunt.active)return;let btn=$('chest-'+label);if(label===hunt.active.answer){hunt.items[hunt.active.index].sorted=true;addCoin(1);showSparkle(hunt.active.index);hunt.active=null;renderHunt();if(hunt.items.every(i=>i.sorted))setTimeout(()=>hunt.completeCb(),500)}else{hunt.attempts++;btn.classList.add('shake');setTimeout(()=>btn.classList.remove('shake'),400);$('huntMsg').textContent=hunt.attempts>=2?'Look for the glowing chest.':'Try again!';if(hunt.attempts>=2)$('chest-'+hunt.active.answer).classList.add('hint')}}function showSparkle(i){let p=hotspots[i%hotspots.length],s=document.createElement('div');s.className='sparkle';s.textContent='✨';s.style.left=(p.x+p.w/2)+'%';s.style.top=(p.y+p.h/2)+'%';$('playScene').appendChild(s);setTimeout(()=>s.remove(),800)}
function startSight(i){let words=levelData.sight[i].words,items=[];words.forEach(w=>{for(let k=0;k<3;k++)items.push({word:w,answer:w})});initHunt('sight','sight',levelData.sight[i].title,items,words,()=>roomComplete('sight',i))}
function startRhyme(i){let lvl=levelData.rhyme[i],items=[];Object.entries(lvl.groups).forEach(([label,words])=>words.forEach(w=>items.push({word:w,answer:label})));initHunt('rhyme','rhyme',lvl.title,items,Object.keys(lvl.groups),()=>roomComplete('rhyme',i))}
// Bakery
let bakery={order:0,phase:1,target:0,second:0,total:0,filled:[],food:'🧁',food2:'🍋'};function startBakery(){setBg('bakery');bakery.order=0;newBakeryOrder()}function newBakeryOrder(){bakery.order++;bakery.phase=Math.random()<.45?1:2;bakery.target=1+Math.floor(Math.random()*6);bakery.second=1+Math.floor(Math.random()*(10-bakery.target));bakery.food=['🧁','🍓','🍪','🍩'][Math.floor(Math.random()*4)];bakery.food2=['🍋','🫐','🍒','🍬'][Math.floor(Math.random()*4)];bakery.filled=Array(10).fill('');renderBakery()}function renderBakery(){let ask=bakery.phase===1?`The dragon wants ${bakery.target} ${bakery.food}`:`The big dragon wants ${bakery.target} ${bakery.food}`;$('overlay').innerHTML=bar('bakery','Bakery Orders',`Orders: ${bakery.order-1}`)+`<div class="panel"><div class="dragon-row"><span class="dragon">🐉</span><span id="bakeryPrompt">${ask}</span></div><div class="tenframe">${bakery.filled.map((v,i)=>`<button class="cell" onclick="tapCell(${i})">${v}</button>`).join('')}</div><div class="msg" id="bakeryMsg">Tap the ten frame squares to serve the dragon.</div></div>`}function tapCell(i){let need=bakery.phase===1?bakery.target:bakery.target+bakery.second;let filled=bakery.filled.filter(Boolean).length;if(bakery.filled[i]){bakery.filled[i]=''}else if(filled<need){bakery.filled[i]=filled<bakery.target?bakery.food:bakery.food2}else return;renderBakery();filled=bakery.filled.filter(Boolean).length;if(bakery.phase===1&&filled===bakery.target){addCoin(1);setTimeout(newBakeryOrder,550)}else if(bakery.phase===2&&filled===bakery.target){$('bakeryPrompt').textContent=`Now the baby dragon wants ${bakery.second} ${bakery.food2}`;$('bakeryMsg').textContent=`${bakery.target} + ${bakery.second} = ? Fill the rest.`}else if(bakery.phase===2&&filled===bakery.target+bakery.second){addCoin(1);showComplete('Order Served!',`${bakery.target} + ${bakery.second} = ${filled}`,newBakeryOrder)}}
// Pattern
let pat={};const icons=['🌷','🌻','🦋','🌸','💎','👑','⭐','🍄'];function makePattern(type){let picks=shuffle(icons).slice(0,type==='ABC'?3:2),seq=[];let unit=type.split('').map(ch=>picks[ch.charCodeAt(0)-65]);for(let r=0;r<2;r++)seq.push(...unit);let answer=unit[seq.length%unit.length];return {seq,answer,choices:shuffle([...new Set([answer,...shuffle(icons.filter(x=>x!==answer)).slice(0,2)])])}}function startPattern(i){setBg('pattern');pat={i,q:0,total:7,attempts:0};nextPattern()}function nextPattern(){pat.q++;pat.p=makePattern(levelData.pattern[pat.i].type);renderPattern()}function renderPattern(){let p=pat.p;$('overlay').innerHTML=bar('pattern',levelData.pattern[pat.i].title,`${pat.q} / ${pat.total}`)+`<div class="panel"><h2 style="text-align:center">Fix the flower bed.</h2><div class="pattern-row">${p.seq.map(x=>`<span>${x}</span>`).join('')}<span class="blank">?</span></div><div class="choice-grid">${p.choices.map(c=>`<button class="choice" id="pc-${c}" onclick="choosePattern('${c}')">${c}</button>`).join('')}</div><div class="msg" id="patMsg"></div></div>`}function choosePattern(c){if(c===pat.p.answer){addCoin(1);if(pat.q>=pat.total)roomComplete('pattern',pat.i);else nextPattern()}else{pat.attempts= (pat.attempts||0)+1;$('patMsg').textContent=pat.attempts>=2?'Look for the glowing flower.':'Try again!';let b=$('pc-'+c);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(pat.attempts>=2)$('pc-'+pat.p.answer).classList.add('hint')}}
// Word Builder
let wb={};function startWord(i){setBg('word');wb={i,words:levelData.word[i].words,q:0,slots:[],attempts:0};nextWord()}function nextWord(){wb.word=wb.words[wb.q];wb.slots=Array(3).fill('');wb.tiles=shuffle(wb.word.split(''));wb.attempts=0;renderWord()}function renderWord(){let picture={cat:'🐱',hat:'🎩',bat:'🦇',mat:'▭',rat:'🐀',can:'🥫',fan:'🪭',man:'👨',pan:'🍳',van:'🚐',hop:'🐰',mop:'🧹',top:'🔝',pop:'🎈',cop:'👮',pin:'📌',fin:'🐟',win:'🏆',tin:'🥫',bin:'🗑️'}[wb.word]||'✨';$('overlay').innerHTML=bar('word',levelData.word[wb.i].title,`${wb.q+1} / ${wb.words.length}`)+`<div class="panel"><div class="prompt-card"><button onclick="speak('${wb.word}')">🔊</button><div style="font-size:4rem">${picture}</div><div>Build the word.</div></div><div class="slot-row">${wb.slots.map((s,i)=>`<button class="slot" onclick="removeLetter(${i})">${s}</button>`).join('')}</div><div class="letters">${wb.tiles.map((t,i)=>`<button class="tile" onclick="addLetter(${i})">${t}</button>`).join('')}</div><div class="msg" id="wordMsg"></div></div>`}function addLetter(i){let empty=wb.slots.indexOf('');if(empty<0)return;wb.slots[empty]=wb.tiles.splice(i,1)[0];renderWord();if(wb.slots.indexOf('')<0)checkWord()}function removeLetter(i){if(wb.slots[i]){wb.tiles.push(wb.slots[i]);wb.slots[i]='';renderWord()}}function checkWord(){let guess=wb.slots.join('').toLowerCase();if(guess===wb.word){addCoin(1);wb.q++;if(wb.q>=wb.words.length)roomComplete('word',wb.i);else setTimeout(nextWord,500)}else{wb.attempts++;$('wordMsg').textContent=wb.attempts>=2?'Look carefully. Try fixing the letters.':'Try again!';document.querySelector('.slot-row').classList.add('shake');setTimeout(()=>document.querySelector('.slot-row')?.classList.remove('shake'),400)}}
// Reading
const storyLevels=[
{title:'The Cat',pages:[['I see a cat.','catSit'],['The cat can hop.','catHop'],['The cat is on a log.','catLog'],['The cat can nap.','catSleep'],['The cat is in a box.','catBox']]},
{title:'The Dog',pages:[['I see a dog.','dogSit'],['The dog can run.','dogRun'],['The dog is on a log.','dogLog'],['The dog can dig.','dogDig'],['The dog is in a box.','dogBox']]},
{title:'The Pig',pages:[['I see a pig.','pigSit'],['The pig can hop.','pigHop'],['The pig is in mud.','pigMud'],['The pig can nap.','pigSleep'],['The pig is on a log.','pigLog']]}
];const sceneKeys=['catSit','catHop','catSleep','catLog','catBox','dogSit','dogRun','dogLog','dogBox','pigSit','pigHop','pigSleep','pigMud','pigLog'];let read={};function startReading(i){setBg('reading');let lvl=i<3?storyLevels[i]:{title:'Mixed Stories',pages:shuffle(storyLevels.flatMap(x=>x.pages)).slice(0,8)};read={i,lvl,q:0,attempts:0,correct:0};renderReading()}function mini(k){let animal=k.startsWith('cat')?'🐱':k.startsWith('dog')?'🐶':'🐷';let extra='';let cls='animal';if(k.includes('Hop')||k.includes('Run'))cls+=' hop';if(k.includes('Sleep'))cls+=' sleep';if(k.includes('Log'))extra='<div class="log"></div>';if(k.includes('Box'))extra='<div class="box"></div>';if(k.includes('Mud'))extra='<div class="mud"></div>';if(k.includes('Dig'))extra='<div class="mud"></div>';return `<div class="mini-scene">${extra}<div class="${cls}">${animal}</div></div>`}function renderReading(){let [sent,ans]=read.lvl.pages[read.q];let choices=shuffle([ans,...shuffle(sceneKeys.filter(x=>x!==ans&&x.slice(0,3)!==ans.slice(0,3) || x!==ans)).slice(0,2)]).slice(0,3);$('overlay').innerHTML=bar('reading',read.lvl.title,`${read.q+1} / ${read.lvl.pages.length}`)+`<div class="panel"><div class="prompt-card"><div style="font-size:1.1rem">Read the sentence. Choose the matching picture.</div><br>${sent}</div><div class="choice-grid">${choices.map(c=>`<button class="choice" id="rc-${c}" onclick="chooseReading('${c}','${ans}')">${mini(c)}</button>`).join('')}</div><div class="msg" id="readMsg"></div></div>`}function chooseReading(c,ans){if(c===ans){addCoin(1);read.correct++;read.q++;if(read.q>=read.lvl.pages.length)roomComplete('reading',read.i);else {read.attempts=0;renderReading()}}else{read.attempts++;$('readMsg').textContent=read.attempts>=2?'Look for the glowing picture.':'Try again!';let b=$('rc-'+c);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(read.attempts>=2)$('rc-'+ans).classList.add('hint')}}
// Clock
let clock={};const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['January','February','March','April','May','June','July','August','September','October','November','December'];function startClock(i){setBg('clock');clock={i,q:0,attempts:0};nextClock()}function dateInfo(){let d=new Date();return {d,day:days[d.getDay()],month:months[d.getMonth()],date:d.getDate(),year:d.getFullYear(),tomorrow:days[(d.getDay()+1)%7],yesterday:days[(d.getDay()+6)%7]}}function calHTML(){let {d}=dateInfo(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells='';days.map(x=>x[0]).forEach(x=>cells+=`<div style="font-weight:900">${x}</div>`);for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=last;n++)cells+=`<div class="daycell ${n===d.getDate()?'today':''}">${n}</div>`;return `<div class="calendar-wrap"><div class="month-art">☀️🏰🌷</div><div class="cal"><h2 style="text-align:center;margin:0">${months[m]} ${y}</h2><div class="calgrid">${cells}</div></div></div>`}function refDays(){return `<div class="reference-strip">${days.map(x=>`<span class="refpill">${x}</span>`).join('')}</div>`}function refMonths(){return `<div class="reference-strip">${months.map(x=>`<span class="refpill">${x}</span>`).join('')}</div>`}function nextClock(){let info=dateInfo(),questions=[];if(clock.i===0)questions=[['Today is...',info.day,shuffle([info.day,info.tomorrow,info.yesterday])],['The month is...',info.month,shuffle([info.month,months[(info.d.getMonth()+1)%12],months[(info.d.getMonth()+11)%12]])],['The date is...',String(info.date),shuffle([String(info.date),String(info.date+1),String(Math.max(1,info.date-1))])],['The year is...',String(info.year),shuffle([String(info.year),String(info.year-1),String(info.year+1)])],['Tomorrow is...',info.tomorrow,shuffle([info.tomorrow,info.day,info.yesterday])],['Yesterday was...',info.yesterday,shuffle([info.yesterday,info.day,info.tomorrow])]];else if(clock.i===1){let idx=Math.floor(Math.random()*7),mode=Math.random()<.5?'after':'before',ans=days[(idx+(mode==='after'?1:6))%7];questions=[[`What comes ${mode} ${days[idx]}?`,ans,shuffle([ans,days[idx],days[(idx+2)%7]])]]}else if(clock.i===2){let idx=Math.floor(Math.random()*12),mode=Math.random()<.5?'after':'before',ans=months[(idx+(mode==='after'?1:11))%12];questions=[[`What month comes ${mode} ${months[idx]}?`,ans,shuffle([ans,months[idx],months[(idx+2)%12]])]]}else{let qs=[['Summer is...', 'hot', ['hot','cold','snowy']],['In winter we wear...', 'coats', ['coats','bathing suits','sandals']],['Pumpkins are in...', 'Fall', ['Fall','Summer','Spring']],['Flowers grow in...', 'Spring', ['Spring','Winter','Fall']],['Snow happens in...', 'Winter', ['Winter','Summer','Spring']]];questions=[shuffle(qs)[0]]}clock.questions=questions;clock.q=0;renderClock()}function renderClock(){let [prompt,ans,choices]=clock.questions[clock.q];let ref=clock.i===0?calHTML():clock.i===1?refDays():clock.i===2?refMonths():`<div class="month-art" style="min-height:160px">${prompt.includes('Summer')?'☀️🏖️':prompt.includes('winter')||prompt.includes('Snow')?'❄️🧥':prompt.includes('Pumpkins')?'🎃🍂':'🌸☔'}</div>`;$('overlay').innerHTML=bar('clock',levelData.clock[clock.i].title,`${clock.q+1} / ${clock.questions.length}`)+`<div class="panel">${ref}<div class="prompt-card" style="margin-top:10px">${prompt}</div><div class="choice-grid">${choices.map(c=>`<button class="choice" id="cc-${c}" onclick="chooseClock('${c}','${ans}')">${c}</button>`).join('')}</div><div class="msg" id="clockMsg"></div></div>`}function chooseClock(c,ans){if(c===ans){addCoin(1);clock.q++;if(clock.q>=clock.questions.length)roomComplete('clock',clock.i);else renderClock()}else{clock.attempts++;$('clockMsg').textContent=clock.attempts>=2?'Use the calendar clue.':'Try again!';let b=$('cc-'+c);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(clock.attempts>=2)$('cc-'+ans).classList.add('hint')}}
function showParent(){let code=prompt('Enter Parent Code');if(code!=='0000')return alert('Incorrect code');setBg('home');$('overlay').innerHTML=`<div class="panel"><h1>Parent Portal</h1><button onclick="state=structuredClone(defaultProgress);save();showHome()">Reset progress</button><button onclick="Object.keys(state.unlocked).forEach(k=>state.unlocked[k]=20);save();showHome()">Unlock all levels</button><button onclick="showHome()">Back</button></div>`}
showHome();updateTop();
</script></body></html>
