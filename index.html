:root{

*{box-sizing:border-box}

.toolbar-title{font-size:clamp(1.25rem,3.3vw,2.25rem)}.progress-pill{font-size:clamp(.95rem,2.3vw,1.3rem);min-width:74px}

.btn{padding:9px 14px;font-size:clamp(.95rem,2.2vw,1.35rem);min-height:50px}.btn.primary{background:linear-gradient(#8d62ff,#6943e3);color:white}.btn.good{background:linear-gradient(#b7ffae,#5ed96d)}
.hero{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px}.hero-title{background:rgba(255,255,255,.78);border:5px solid var(--lav);border-radius:28px;padding:10px;text-align:center;font-size:clamp(1.4rem,4vw,2.5rem);font-weight:900}
.wing-grid,.room-grid,.level-grid{display:grid;gap:18px;justify-content:center;align-content:start}.wing-grid{grid-template-columns:repeat(3,minmax(165px,210px));padding-top:20px}.room-grid{grid-template-columns:repeat(auto-fit,minmax(145px,175px));max-width:960px;margin:0 auto;padding:14px}.level-grid{grid-template-columns:repeat(auto-fit,minmax(145px,180px));max-width:1000px;margin:0 auto;padding:10px}

.level-card{min-height:130px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(.95rem,2.3vw,1.25rem);position:relative}.level-card .emoji{font-size:2rem;margin-bottom:5px}.status-line{font-size:.78rem;margin-top:6px}.level-grid.dense{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:6px}.level-grid.dense .level-card{min-height:103px;padding:6px;font-size:.92rem}.level-grid.dense .level-card .emoji{font-size:1.55rem;margin-bottom:2px}.level-grid.dense .status-line{font-size:.66rem;margin-top:3px}

.game-card{width:min(96%,920px);max-height:100%;overflow:auto;background:rgba(255,255,255,.82);border:6px solid var(--lav);border-radius:30px;padding:12px;text-align:center;box-shadow:0 16px 30px rgba(0,0,0,.18)}

.small-prompt{font-size:clamp(1rem,2.4vw,1.45rem);font-weight:900;margin:6px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:100px;padding:9px;font-size:clamp(1.05rem,2.8vw,1.7rem);display:grid;place-items:center;overflow:hidden}.choice.selected,.number-btn.selected{outline:7px solid var(--gold);background:linear-gradient(#fffbd3,#ffe86c)}.choice.correct{outline:7px solid #4fd364}.choice.wrong{animation:shake .35s}

.message{min-height:34px;position:sticky;bottom:0;background:rgba(255,255,255,.88);border-radius:12px;z-index:3;;font-size:1.2rem;font-weight:900;margin-top:8px}.read-row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:7px 0}.read-btn{background:#6b58ed;color:white}
.number-line{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding:8px 4px;margin:6px auto;max-width:100%}.number-btn{flex:0 0 auto;width:48px;height:48px;border-radius:50%;font-size:1.25rem;padding:0}.number-btn.small{width:39px;height:39px;font-size:1rem;border-width:4px;box-shadow:0 5px 0 var(--shadow)}
.ten-row{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}.ten-frame{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:5px;padding:8px;border:5px solid var(--purple);border-radius:20px;background:#fff}.ten-cell{border:4px solid var(--purple2);border-radius:12px;background:white;display:grid;place-items:center;min-width:0}.ten-cell.filled{background:#ffdf36;box-shadow:inset 0 0 0 5px #ffc20a}.ten-cell.removed{background:#eee;color:#d22;font-size:1.7rem}.ten-cell.disabled{border-color:#aaa;background:#f5f5f5}.ten-cell.filled.disabled{background:#ffdf36;box-shadow:inset 0 0 0 5px #ffc20a;border-color:var(--purple2)}
.equation{font-size:clamp(1.3rem,3.8vw,2.2rem);font-weight:900;margin:5px 0}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}
.gator-choices{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:22px;justify-content:center}.gator-choices.three{grid-template-columns:repeat(3,minmax(0,200px));gap:12px}.gator-choices.three .gator-button{height:132px}.gator-button{height:150px;padding:18px;overflow:hidden;position:relative}.gator-button img{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:auto;height:72%;max-width:78%;max-height:72%;object-fit:contain;object-position:center}.numberline20{display:flex;gap:3px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;margin:4px auto 8px;padding:3px}.numberline20 span{width:34px;height:34px;flex:0 0 auto;border:3px solid var(--purple2);border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:900;font-size:.86rem}.numberline20 span.hot{background:#ffe84f;border-color:#d5a700}

.pattern-line{display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,18px);font-size:clamp(2rem,6vw,4rem);margin:12px 0;flex-wrap:wrap}.pattern-blank{width:70px;height:70px;border:5px dashed var(--purple);border-radius:18px;background:#fff9;display:grid;place-items:center;font-size:2.4rem}
.sparkle-scene{height:min(50vh,470px);min-height:290px;border:6px solid #fff09a;border-radius:26px;position:relative;overflow:hidden;background-size:cover;background-position:center}.sparkle{position:absolute;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #ffd2f3;background:rgba(255,255,255,.9);box-shadow:0 0 18px 7px rgba(224,93,214,.55);font-size:1.7rem;display:grid;place-items:center}.sparkle.used{visibility:hidden}.chest-dock{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;margin-top:8px}.chest{height:76px;border:4px solid #d3a928;border-radius:18px;background:repeating-linear-gradient(0deg,#48aef2 0 16px,#2083d6 16px 31px);color:#fff;box-shadow:0 6px 0 #8f6500;font-weight:900;font-size:1.2rem}.chest:nth-child(2n){background:repeating-linear-gradient(0deg,#b86cff 0 16px,#7e35cc 16px 31px)}.chest:nth-child(3n){background:repeating-linear-gradient(0deg,#ffb43e 0 16px,#e37700 16px 31px)}.active-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:#fffdf4;border:5px solid var(--purple2);border-radius:22px;padding:12px 22px;box-shadow:0 8px 0 var(--shadow);font-size:1.6rem;font-weight:900}
.base10-model{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:150px}.ten-rod{width:48px;height:142px;display:grid;grid-template-rows:repeat(10,1fr);border:4px solid #174c66;background:#32b8e8}.ten-rod i{border-bottom:2px solid #174c66}.ones-cubes{display:grid;grid-template-columns:repeat(5,42px);gap:8px;align-content:end}.one-cube{width:42px;height:42px;border:4px solid #174c66;background:#32b8e8;border-radius:4px}.model-choice{min-height:175px;padding:7px}.model-choice .base10-model{transform:scale(.78);transform-origin:center;min-height:145px}
.shape-display{height:120px;display:grid;place-items:center}.shape-svg{width:130px;height:105px}.shape-choice{min-height:150px}.shape-hunt-board{position:relative;height:330px;background:rgba(255,255,255,.42);border:4px solid #efd86d;border-radius:23px;overflow:hidden}.hunt-shape{position:absolute;width:74px;height:74px;transform:translate(-50%,-50%);border:0;background:transparent;padding:3px}.hunt-shape.selected{outline:7px solid #ffdf34;border-radius:18px}.hunt-shape svg{width:100%;height:100%}
.calendar{max-width:730px;margin:0 auto;background:#fff;border:5px solid var(--purple2);border-radius:22px;padding:8px}.calendar h2{margin:2px 0 6px;font-size:1.8rem}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar-cell{height:31px;border-radius:8px;background:#f6ebff;display:grid;place-items:center;font-weight:900}.calendar-cell.today{background:#ffe86c;outline:3px solid #e6aa00}.reference-strip{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:7px}.reference-pill{border:3px solid var(--purple2);border-radius:13px;background:#fff;padding:5px 8px;font-weight:900}.reference-pill.active{background:#ffe86c}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin:10px}.key-btn{height:55px;border-radius:18px;font-size:1.5rem}.entry-line{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;background:#fff;border:4px solid var(--lav);border-radius:18px;padding:8px;margin:6px auto;max-width:720px}.map-grid{display:grid;grid-template-columns:repeat(6,52px);gap:4px;justify-content:center;margin:8px auto}.map-cell{width:52px;height:52px;background:#fff;border:3px solid var(--purple2);border-radius:10px;display:grid;place-items:center;font-size:1.7rem}.map-cell.block{background:#aa8b73}.map-cell.path{background:#e6d1ff}.arrow-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.arrow{min-width:54px;height:50px;font-size:1.5rem}
.modal{position:fixed;inset:0;z-index:100;background:rgba(52,29,79,.42);display:grid;place-items:center;padding:14px}.modal-card{width:min(92vw,620px);background:#fffdf4;border:7px solid var(--lav);border-radius:30px;padding:18px;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.3)}.modal-card h2{font-size:2rem;margin:4px}.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.parent-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}.parent-form label{font-weight:900}.parent-form input{width:100%;padding:8px;border:3px solid var(--lav);border-radius:10px;margin-top:3px;font-size:1rem}

@media(max-width:760px){
 .topbar{grid-template-columns:auto 1fr auto}.nav-icons .icon-button:not(:first-child){display:none}.stat{min-width:58px;padding:0 7px}.app-title{font-size:1.25rem}.wing-grid{grid-template-columns:repeat(3,minmax(105px,1fr));gap:10px}.tile{min-height:120px}.room-grid,.level-grid{gap:12px}.toolbar{grid-template-columns:auto 1fr auto}.toolbar-title{min-height:52px}.choices{gap:8px}.choice{min-height:84px}.coin-group-grid{grid-template-columns:repeat(2,minmax(100px,1fr))}.parent-form{grid-template-columns:1fr}
}

 .wing-grid{grid-template-columns:1fr;max-width:430px;margin:auto;padding-top:10px}.wing-grid .tile{min-height:105px;flex-direction:row;gap:12px}.wing-grid .tile .emoji{margin:0}.game-shell{height:calc(100% - 65px)}.sparkle-scene{height:50vh}.coin-field{height:390px}.coin-group-grid{grid-template-columns:repeat(2,minmax(110px,1fr))}.gator-button{height:132px;padding:18px}.gator-button img{height:68%;max-height:68%;max-width:72%}.gator-choices.three{gap:7px}.gator-choices.three .gator-button{height:115px;padding:10px}.numberline20{gap:2px;overflow:visible;padding:2px}.numberline20 span{width:29px;height:29px;font-size:.72rem;border-width:2px}.ten-frame{grid-template-columns:repeat(5,38px);grid-template-rows:repeat(2,38px)}.level-grid.dense{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:4px}.level-grid.dense .level-card{min-height:94px;padding:4px;font-size:.82rem}.level-grid.dense .level-card .emoji{font-size:1.35rem}.level-grid.dense .status-line{font-size:.6rem}

/* feedback revision */
.screen{background-color:#f8e8ff;background-repeat:no-repeat}
.game-shell{background:rgba(255,255,255,.08)}

<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="nav-icons">
        <button class="icon-button" data-action="home" aria-label="Castle home">🏰</button>
        <button class="icon-button" data-action="wing" data-wing="reading" aria-label="Reading wing">📚</button>
        <button class="icon-button" data-action="wing" data-wing="math" aria-label="Math wing">🔢</button>
        <button class="icon-button" data-action="wing" data-wing="adventure" aria-label="Adventure wing">🌎</button>
      </div>
      <div class="app-title">Princess Castle Academy</div>
      <div class="stats" aria-label="Rewards">
        <span class="stat">💎 <b id="gemCount">0</b></span>
        <span class="stat">🪙 <b id="coinCount">0</b></span>
        <button class="icon-button" data-action="parent" aria-label="Parent portal">🔒</button>
      </div>
    </header>
    <main id="screen" class="screen" aria-live="polite">
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script>
(() => {
'use strict';

const $ = (id) => document.getElementById(id);

const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr) => arr[Math.floor(Math.random()*arr.length)];
const esc = (s) => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uniqueBy = (arr,keyFn=x=>JSON.stringify(x)) => {const seen=new Set(); return arr.filter(x=>{const k=keyFn(x); if(seen.has(k))return false; seen.add(k); return true;});};
function takeUnique(pool,n,keyFn=x=>JSON.stringify(x)){
  const u=shuffle(uniqueBy(pool,keyFn));
  if(u.length>=n) return u.slice(0,n);
  const out=[...u];
  while(out.length<n && u.length) out.push(...shuffle(u).slice(0,Math.min(u.length,n-out.length)));
  return out.slice(0,n);
}
function range(a,b){return Array.from({length:b-a+1},(_,i)=>a+i)}

function cleanSpeechText(t){return String(t).replace(/[✨✅🌟⭐💎🪙🔟🧁🐊🌷🔎🏰📚🔢🌎📞🏠🪙]/g,'').replace(/\s+/g,' ').trim();}
function speak(text,{digits=false}={}){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  let t=cleanSpeechText(text);
  if(digits)t=t.replace(/\d/g,d=>['zero','one','two','three','four','five','six','seven','eight','nine'][Number(d)]+' ');
  const u=new SpeechSynthesisUtterance(t);u.rate=.86;u.pitch=1.05;speechSynthesis.speak(u);
}

 session.questions=i===0?takeUnique(addPool,8,x=>x.key):i===1?takeUnique(subPool,8,x=>x.key):shuffle([...shuffle(addPool).slice(0,4),...shuffle(subPool).slice(0,4)]);
 session.orders=0;setupBakeryQuestion();renderBakery();
}

const PATTERN_ICONS=['🌻','💎','🌷','🦋','🍎','🍌','🍇','⭐','🧁','🐞','🍓','🌈'];
function generatePatternQuestions(type){const out=[];for(let k=0;k<30;k++){
 if(['AB','ABB','AAB','ABC'].includes(type)){const parts=shuffle(PATTERN_ICONS).slice(0,type==='ABC'?3:2);let unit=type.split('').map(ch=>parts[ch.charCodeAt(0)-65]);let seq=[];while(seq.length<6)seq.push(...unit);seq=seq.slice(0,6);const answer=unit[seq.length%unit.length];const distract=shuffle(PATTERN_ICONS.filter(x=>!parts.includes(x))).slice(0,1);const choices=type==='ABC'?shuffle([...parts]):shuffle(uniqueBy([...parts,...distract]));out.push({kind:'icons',seq,answer,choices,key:type+seq.join('')});
 }else if(type==='letters'){const step=sample([1,2]);const start=rand(0,25-5*step);const seq=range(0,4).map(i=>String.fromCharCode(65+start+i*step));const answer=String.fromCharCode(65+start+5*step),code=answer.charCodeAt(0);const nearby=uniqueBy([code-step,code+step,code-1,code+1].filter(c=>c>=65&&c<=90).map(c=>String.fromCharCode(c))).filter(x=>x!==answer);const choices=shuffle([answer,...shuffle(nearby).slice(0,2)]);out.push({kind:'text',seq,answer,choices,key:seq.join('-')});
 }else if(type==='numbers'){const start=rand(0,8),step=sample([1,2,5]);const seq=range(0,4).map(i=>start+i*step),answer=start+5*step;out.push({kind:'text',seq,answer,choices:shuffle([answer,answer-step,answer+step]),key:seq.join('-')});
 }else if(type==='order'){const n=rand(2,18),mode=sample(['before','after','between']);if(mode==='before')out.push({kind:'order',prompt:`What number comes before ${n}?`,answer:n-1,choices:shuffle([n-1,n,n+1]),key:`b${n}`});else if(mode==='after')out.push({kind:'order',prompt:`What number comes after ${n}?`,answer:n+1,choices:shuffle([n-1,n,n+1]),key:`a${n}`});else out.push({kind:'order',prompt:`What number is between ${n-1} and ${n+1}?`,answer:n,choices:shuffle([n-1,n,n+1]),key:`m${n}`});}
 }
 return uniqueBy(out,x=>x.key);
}
function startPattern(i){const types=['AB','ABB','AAB','ABC','letters','numbers','order'];if(i<7)session.questions=takeUnique(generatePatternQuestions(types[i]),8,x=>x.key);else{const first=types.map(t=>sample(generatePatternQuestions(t))),all=uniqueBy(types.flatMap(generatePatternQuestions),x=>x.key),extra=sample(all.filter(x=>!first.some(q=>q.key===x.key)));session.questions=shuffle([...first,extra]);}renderPattern();}
function renderPattern(){const q=session.questions[session.q];let body;if(q.kind==='order')body=`<div class="prompt">${q.prompt}</div>`;else body=`<div class="prompt">What comes next?</div><div class="pattern-line">${q.seq.map(x=>`<span>${x}</span>`).join('')}<span class="pattern-blank">?</span></div>`;
 const choices=uniqueBy(q.choices);gameFrame(`🌷 ${ROOMS.pattern.levels[session.level][0]}`,`<div class="game-card">${body}<div class="choices">${choices.map(c=>`<button class="choice" data-action="pattern-answer" data-answer="${esc(c)}">${c}</button>`).join('')}</div><div class="message" id="gameMessage"></div></div>`,questionProgress());}

function compareRange(i){return [[1,5],[1,10],[10,15],[1,15],[10,20],[1,20]][Math.min(i,5)]}
function startCompare(i){let [lo,hi]=compareRange(i===6?5:i);const pool=[];for(let a=lo;a<=hi;a++)for(let b=lo;b<=hi;b++)if(a!==b)pool.push({a,b,key:`${a}-${b}`});if(i===6){const equals=shuffle(range(lo,hi)).slice(0,2).map(n=>({a:n,b:n,key:`${n}-${n}`}));session.questions=shuffle([...shuffle(pool).slice(0,6),...equals]);}else session.questions=takeUnique(pool,8,x=>x.key);session.tapped=[];renderCompare();}

function startCount(i){const modes=['line','scatter','twos','fives','tens'];session.modes=i===5?shuffle([...modes,...shuffle(modes).slice(0,3)]):null;session.mode=i===5?session.modes[0]:modes[i];session.questions=shuffle(range(1,10)).slice(0,8);session.checked=new Set();session.selected=null;renderCount();}
function countValue(){const groups=session.questions[session.q];return groups*(session.mode==='twos'?2:session.mode==='fives'?5:session.mode==='tens'?10:1)}
function scatterCoordinates(n){const coords=[];let attempts=0;while(coords.length<n&&attempts<1000){attempts++;const x=rand(8,92),y=rand(15,85);if(coords.every(p=>Math.hypot(p.x-x,p.y-y)>15))coords.push({x,y});}return coords;}
function renderCount(){if(session.level===5)session.mode=session.modes[session.q];const groups=session.questions[session.q],mode=session.mode;let field='';if(mode==='scatter'||mode==='line'){
 const coords=mode==='line'?range(0,groups-1).map((_,i)=>({x:groups===1?50:8+i*(84/(groups-1)),y:50})):scatterCoordinates(groups);session.coords=session.coords&&session.coords.length===groups?session.coords:coords;
 field=`<div class="coin-field">${session.coords.map((p,j)=>`<button class="coin ${session.checked.has(j)?'checked':''}" style="left:${p.x}%;top:${p.y}%" data-action="count-item" data-index="${j}">🪙</button>`).join('')}</div>`;
 }else{const cls=mode==='twos'?'pair-coins':mode==='fives'?'five-coins':'mini-ten';const unit=mode==='twos'?2:mode==='fives'?5:10;field=`<div class="coin-group-grid">${range(0,groups-1).map((_,j)=>`<button class="coin-group ${session.checked.has(j)?'checked':''}" data-action="count-item" data-index="${j}"><div class="${cls}">${range(1,unit).map(()=>'<span>🪙</span>').join('')}</div></button>`).join('')}</div>`;}
 const title=mode==='scatter'?'Scattered Count':mode==='line'?'Line Count':mode==='twos'?'Count by 2s':mode==='fives'?'Count by 5s':'Count by 10s';
 gameFrame(`🪙 ${session.level===5?'Mixed Review':title}`,`<div class="game-card"><div class="prompt">Tap each ${mode==='scatter'||mode==='line'?'coin':'group'} while you count.</div>${field}<div class="small-prompt">Choose how many you counted.</div>${numberLineValuesHTML(mode==='tens'?range(0,10).map(n=>n*10):mode==='fives'?range(0,10).map(n=>n*5):mode==='twos'?range(0,10).map(n=>n*2):range(0,10),'count-number',session.selected,true)}<div class="controls"><button class="btn good" data-action="count-check">✅ Check</button></div><div class="message" id="gameMessage"></div></div>`,questionProgress());}

function makeTeenPool(){return shuffle(range(11,19));}

function buildCalendar(d){const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let day=1;day<=days;day++)cells+=`<div class="calendar-cell ${day===d.getDate()?'today':''}">${day}</div>`;return `<div class="calendar"><h2>${['January','February','March','April','May','June','July','August','September','October','November','December'][m]} ${y}</h2><div class="calendar-grid">${['S','M','T','W','T','F','S'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>`;}
function makeRelativeDayQuestions(kind){
 const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],out=[];let d=new Date();d.setHours(12,0,0,0);let tries=0;
 while(out.length<8&&tries++<180){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);const dow=d.getDay(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const valid=kind==='tomorrow'?(dow>=1&&dow<=5&&d.getDate()<last):(dow>=2&&dow<=6&&d.getDate()>1);if(!valid)continue;
  const delta=kind==='tomorrow'?1:-1,answer=days[(dow+delta+7)%7];out.push({reference:new Date(d),answer,choices:shuffle([answer,days[dow],days[(dow-delta+7)%7]]),key:`${kind}-${d.toISOString().slice(0,10)}`});
 }
 return out;
}
function startClock(i){const today=new Date();today.setHours(12,0,0,0);if(i===0){const d=new Date(today);session.questions=[{kind:'month',d},{kind:'day',d},{kind:'date',d},{kind:'year',d},{kind:'tomorrow',d},{kind:'yesterday',d}];}else if(i===1)session.questions=makeRelativeDayQuestions('tomorrow');else if(i===2)session.questions=makeRelativeDayQuestions('yesterday');else if(i===3){const pool=[];for(let m=1;m<=10;m++){pool.push({month:m,prompt:`What month comes before ${MONTHS[m]}?`,answer:MONTHS[m-1],choices:shuffle([MONTHS[m-1],MONTHS[m],MONTHS[m+1]]),key:`b${m}`});pool.push({month:m,prompt:`What month comes after ${MONTHS[m]}?`,answer:MONTHS[m+1],choices:shuffle([MONTHS[m-1],MONTHS[m],MONTHS[m+1]]),key:`a${m}`});}session.questions=takeUnique(pool,8,x=>x.key);}else{session.questions=takeUnique(SEASON_Q,8,x=>x.key);}renderClock();}

function renderClock(){const i=session.level;if(i===0){const q=session.questions[session.q],d=q.d,days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=MONTHS;let prompt,answer,choices;
  if(q.kind==='month'){prompt='What month is it?';answer=months[d.getMonth()];choices=shuffle([answer,months[(d.getMonth()+11)%12],months[(d.getMonth()+1)%12]]);}

  if(q.kind==='yesterday'){prompt='What day was yesterday?';answer=days[(d.getDay()+6)%7];choices=shuffle([answer,days[d.getDay()],days[(d.getDay()+1)%7]]);}
  session.expected=answer;gameFrame('🕰️ Today\'s Calendar',`<div class="game-card"><div class="prompt">${prompt}</div>${buildCalendar(d)}<div class="choices">${choices.map(c=>`<button class="choice" data-action="clock-answer" data-answer="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="message" id="gameMessage"></div></div>`,questionProgress());

 }else{const q=session.questions[session.q];session.expected=q.answer;const refs=i===3?MONTHS:`Spring,Summer,Fall,Winter`.split(',');gameFrame(`🕰️ ${ROOMS.clock.levels[i][0]}`,`<div class="game-card"><div class="reference-strip">${refs.map(x=>`<span class="reference-pill ${q.prompt.includes(x)?'active':''}">${x}</span>`).join('')}</div><div class="prompt">${q.prompt}</div><div class="read-row"><button class="btn read-btn" data-action="speak" data-text="${esc(q.prompt)}">🔊 Read</button></div><div class="choices">${q.choices.map(c=>`<button class="choice" data-action="clock-answer" data-answer="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="message" id="gameMessage"></div></div>`,questionProgress());}}


let messenger=null;
function digitsOnly(s){return String(s||'').replace(/\D/g,'');}
function fmtPhone(s){s=digitsOnly(s).padEnd(10,'_');return `${s.slice(0,3)}-${s.slice(3,6)}-${s.slice(6,10)}`;}
function phoneSpeak(s){return digitsOnly(s).split('').map(d=>['zero','one','two','three','four','five','six','seven','eight','nine'][Number(d)]).join(' ');}
function startMessenger(i){if(i===0)return startPhone('mom');if(i===1)return startPhone('dad');if(i===2)return startAddress();return startMessengerMixed();}
function startPhone(who){const phone=digitsOnly(state.info[who+'Phone']||'');if(phone.length!==10){gameFrame('📞 Phone Practice',`<div class="game-card"><div class="prompt">A 10-digit ${who} phone number has not been saved in the Parent Portal.</div><button class="btn" data-action="parent">Open Parent Portal</button></div>`,'');return;}messenger={type:'phone',who,part:0,rep:0,typed:'',phone};renderPhone();}
function renderPhone(){const {who,part,rep,phone}=messenger;const name=state.info[who]||who;const parts=[phone.slice(0,3),phone.slice(3,6),phone.slice(6),phone];const masks=[`___-${phone.slice(3,6)}-${phone.slice(6)}`,`${phone.slice(0,3)}-___-${phone.slice(6)}`,`${phone.slice(0,3)}-${phone.slice(3,6)}-____`,`___-___-____`];const target=parts[part];messenger.target=target;const shown=masks[part].replace(/_+/,(messenger.typed+'_'.repeat(target.length)).slice(0,target.length));gameFrame(`📞 ${name}'s Number`, `<div class="game-card"><div class="phone-header-row"><div class="entry-line">${fmtPhone(phone)}</div><button class="btn read-btn" data-action="speak" data-text="${phoneSpeak(phone)}">🔊 Hear</button></div><div class="prompt">Fill in the missing digits.</div><div class="entry-line">${shown}</div><div class="keypad">${'123456789'.split('').map(d=>`<button class="key-btn" data-action="phone-key" data-key="${d}">${d}</button>`).join('')}<button class="key-btn" data-action="phone-back">⌫</button><button class="key-btn" data-action="phone-key" data-key="0">0</button><button class="key-btn good phone-submit" data-action="phone-check">📞</button></div><div class="small-prompt">Practice ${rep+1} of 4</div><div class="message" id="gameMessage"></div></div>`,`${part+1}/4`);}
const ADDRESS_STEPS=[
 ['house','Which house number is yours?'],['street','Which street do you live on?'],['city','Which city do you live in?'],['zip','Which ZIP code is yours?']
];
function addressSpeech(key,val){if(key==='house'||key==='zip')return digitsOnly(val).split('').map(d=>['zero','one','two','three','four','five','six','seven','eight','nine'][Number(d)]).join(' ');return String(val).replace(/\bCt\b/i,'Court').replace(/\bRd\b/i,'Road').replace(/\bSt\b/i,'Street').replace(/\bLn\b/i,'Lane');}
function startAddress(){messenger={type:'address',step:0,rep:0};renderAddress();}
function renderAddress(){const [key,prompt]=ADDRESS_STEPS[messenger.step],correct=state.info[key];const distract={house:['2508','5208','5802','5028'],street:['Pine Road','Oak Lane','Maple Street','Elkheart Court'],city:['Centreville','Fairfax','Chantilly','Vienna'],zip:['20120','20121','20151','22030']}[key].filter(x=>x!==correct&&x!==addressSpeech(key,correct));const choices=shuffle([correct,...shuffle(distract).slice(0,2)]);messenger.expected=correct;gameFrame('🏠 Home Address',`<div class="game-card"><div class="prompt">${prompt}</div><div class="read-row"><button class="btn read-btn" data-action="speak" data-text="${addressSpeech(key,correct)}">🔊 Hear Answer</button></div><div class="choices">${choices.map(c=>`<button class="choice" data-action="address-answer" data-answer="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="small-prompt">Practice ${messenger.rep+1} of 4</div><div class="message" id="gameMessage"></div></div>`,`${messenger.step+1}/4`);}
function startMessengerMixed(){const pool=[];for(let k=0;k<4;k++)pool.push({kind:'address',step:k,key:`a${k}`});for(const who of ['mom','dad']){const phone=digitsOnly(state.info[who+'Phone']);if(phone.length===10)for(let part=0;part<4;part++)pool.push({kind:'phone',who,part,key:`${who[0]}${part}`});}session.questions=takeUnique(pool,8,x=>x.key);renderMessengerMixed();}
function renderMessengerMixed(){const q=session.questions[session.q];if(q.kind==='address'){const [key,prompt]=ADDRESS_STEPS[q.step],correct=state.info[key];const all={house:['2508','5208','5802'],street:['Pine Rd','Oak Lane','Elkheart Ct'],city:['Centreville','Fairfax','Chantilly'],zip:['20120','20121','20151']}[key];const choices=shuffle(uniqueBy([correct,...all]).filter(Boolean)).slice(0,3);session.expected=correct;gameFrame('📞 Messenger Mixed Review',`<div class="game-card"><div class="prompt">${prompt}</div><div class="choices">${choices.map(c=>`<button class="choice" data-action="messenger-mixed-answer" data-answer="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="message" id="gameMessage"></div></div>`,questionProgress());}else{const phone=digitsOnly(state.info[q.who+'Phone']);if(phone.length!==10){session.q++;return session.q>=session.questions.length?completeCurrent():renderMessengerMixed();}const name=state.info[q.who],parts=[phone.slice(0,3),phone.slice(3,6),phone.slice(6),phone],target=parts[q.part];session.expected=target;session.mixedTyped='';session.mixedPhone={name,phone,target,part:q.part};renderMessengerMixedPhone();}}
function renderMessengerMixedPhone(){const x=session.mixedPhone;gameFrame('📞 Messenger Mixed Review',`<div class="game-card"><div class="prompt">${['Enter the first three digits of','Enter the middle three digits of','Enter the last four digits of',`Enter ${x.name}\'s full`][x.part]} ${x.part===3?'phone number.':`${x.name}\'s phone number.`}</div><div class="entry-line">${session.mixedTyped||'_ '.repeat(x.target.length)}</div><div class="keypad">${'123456789'.split('').map(d=>`<button class="key-btn" data-action="mixed-phone-key" data-key="${d}">${d}</button>`).join('')}<button class="key-btn" data-action="mixed-phone-back">⌫</button><button class="key-btn" data-action="mixed-phone-key" data-key="0">0</button><button class="key-btn good" data-action="mixed-phone-check">✅</button></div><div class="message" id="gameMessage"></div></div>`,questionProgress());}

function makeMapQuestion(level){
 const size=level===0?3:level===1?4:5;let start,goal,path=[],blocks=[];
 if(level===0){const horizontal=Math.random()<.5,len=rand(1,Math.min(2,size-1));if(horizontal){const y=rand(0,size-1);start={x:0,y};goal={x:len,y};path=Array(len).fill('R');}else{const x=rand(0,size-1);start={x,y:size-1};goal={x,y:size-1-len};path=Array(len).fill('U');}}
 else{start={x:0,y:size-1};goal={x:size-1,y:0};let x=start.x,y=start.y;while((x<goal.x||y>goal.y)&&path.length<5){const opts=[];if(x<goal.x)opts.push('R');if(y>goal.y)opts.push('U');const m=sample(opts);path.push(m);if(m==='R')x++;else y--;}goal={x,y};if(level>=2){let tries=0;while(blocks.length<Math.min(3,size-2)&&tries++<100){const b={x:rand(0,size-1),y:rand(0,size-1)};if((b.x===start.x&&b.y===start.y)||(b.x===goal.x&&b.y===goal.y)||blocks.some(z=>z.x===b.x&&z.y===b.y))continue;blocks.push(b);}}}
 return {size,start,goal,path,blocks,key:`${size}-${start.x},${start.y}-${goal.x},${goal.y}-${path.join('')}`};
}
function startMap(i){const questions=[];let tries=0;if(i===4){for(let level=0;level<4;level++){let q;do{q=makeMapQuestion(level);}while(questions.some(x=>x.key===q.key));questions.push(q);}}while(questions.length<5&&tries++<300){const q=makeMapQuestion(i===4?rand(0,3):i);if(!questions.some(x=>x.key===q.key))questions.push(q);}session.questions=shuffle(questions);session.pathIndex=0;session.current={...session.questions[0]};session.entered=[];renderMap();}
function renderMap(){const q=session.questions[session.pathIndex],trail=[{...q.start}];let p={...q.start};for(const m of session.entered){if(m==='R')p.x++;if(m==='L')p.x--;if(m==='U')p.y--;if(m==='D')p.y++;trail.push({...p});}const cells=[];for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++){const block=q.blocks.some(b=>b.x===x&&b.y===y),on=trail.some(t=>t.x===x&&t.y===y);cells.push(`<div class="map-cell ${block?'block':''} ${on?'path':''}">${x===q.start.x&&y===q.start.y?'👸':x===q.goal.x&&y===q.goal.y?'💎':block?'🪨':''}</div>`);}const slots=range(0,q.path.length-1).map((_,i)=>`<div class="map-slot">${session.entered[i]?({R:'➡️',L:'⬅️',U:'⬆️',D:'⬇️'}[session.entered[i]]):''}</div>`).join('');gameFrame(`🗺️ ${ROOMS.map.levels[session.level][0]}`,`<div class="game-card"><div class="prompt">Build a path to the treasure.</div><div class="map-grid" style="grid-template-columns:repeat(${q.size},1fr)">${cells.join('')}</div><div class="map-slots">${slots}</div><div class="arrow-row">${[['U','⬆️'],['D','⬇️'],['L','⬅️'],['R','➡️']].map(([k,e])=>`<button class="btn arrow" data-action="map-arrow" data-key="${k}">${e}</button>`).join('')}<button class="btn" data-action="map-back">⌫</button><button class="btn good" data-action="map-check">✅ Check</button></div><div class="message" id="gameMessage"></div></div>`,`${session.pathIndex+1}/${session.questions.length}`);}

 if(a==='room')return showLevels(b.dataset.room||nav.room);
 if(a==='start-level')return startLevel(b.dataset.room,Number(b.dataset.level));
 if(a==='replay'){closeModal();return startLevel(nav.room,nav.level);}
 if(a==='next-level'){const r=nav.room,l=nav.level+1;closeModal();return startLevel(r,l);}
 if(a==='close-modal')return closeModal();
 if(a==='parent'){const code=prompt('Enter Parent Portal Code');if(code==='0000')return renderParentPortal();if(code!==null)alert('Incorrect code');return;}
 if(a==='speak')return speak(b.dataset.text||'');
 if(a==='add-sight-level'){for(const k of Object.keys(DEFAULT_INFO)){const el=$('parent_'+k);if(el)state.info[k]=el.value.trim();}state.sightLevels=state.sightLevels.map((_,idx)=>($('sight_'+idx)?.value||'').split(',').map(x=>x.trim()).filter(Boolean));const aDone=completedArray('sight'),oldMixed=aDone[state.sightLevels.length]||false;state.sightLevels.push([]);if(oldMixed){aDone[state.sightLevels.length-1]=false;aDone[state.sightLevels.length]=true;}syncSightRoomLevels();save();return renderParentPortal();}
 if(a==='parent-save'){for(const k of Object.keys(DEFAULT_INFO)){const el=$('parent_'+k);if(el)state.info[k]=el.value.trim();}state.sightLevels=state.sightLevels.map((_,idx)=>($('sight_'+idx)?.value||'').split(',').map(x=>x.trim()).filter(Boolean));syncSightRoomLevels();save();closeModal();return;}
 if(a==='reset-progress'){if(confirm('Reset all level progress and rewards?')){const info=state.info,sightLevels=state.sightLevels;state=defaultState();state.info=info;state.sightLevels=sightLevels;syncSightRoomLevels();save();closeModal();showHome();}return;}

 if(a==='reading-answer'){const q=session.questions[session.q];return handleCorrectChoice(b,b.dataset.answer===q[0],renderReading);}
 if(a==='sight-spark'){const j=Number(b.dataset.index);if(session.items[j]?.sorted)return;session.active=j;renderSight();return speak(session.items[j].word);}
 if(a==='sight-chest'){if(session.active===null)return;const item=session.items[session.active];if(b.dataset.word===item.word){item.sorted=true;session.levelProgress[item.word]++;earnCoin();session.active=null;if(session.items.every(x=>x.sorted)){markDone('sight',session.level);showCompletion('sight',session.level);}else renderSight();}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);}return;}
 if(a==='rhyme-spark'){const j=Number(b.dataset.index);if(j!==session.index)return;session.active=j;renderRhyme();return speak(session.items[j].word);}
 if(a==='rhyme-chest'){if(session.active===null)return;const x=session.items[session.active];if(b.dataset.label===x.label){earnCoin();session.index++;session.active=null;if(session.index>=8){markDone('rhyme',session.level);showCompletion('rhyme',session.level);}else renderRhyme();}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);}return;}
 if(a==='sound-spark'){const j=Number(b.dataset.index);if(j!==session.index)return;session.active=j;renderSound();return speak(session.items[j].word);}
 if(a==='sound-chest'){if(session.active===null)return;const x=session.items[session.active];if(b.dataset.label===x.label){earnCoin();session.index++;session.active=null;if(session.index>=8){markDone('sound',session.level);showCompletion('sound',session.level);}else renderSound();}else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);}return;}
 if(a==='spell-letter'){const id=Number(b.dataset.id),o=session.letterBank.find(x=>x.id===id);if(o&&!session.usedLetters.has(id)){session.usedLetters.add(id);session.built+=o.letter;}return renderSpelling();}
 if(a==='spell-clear'){session.built='';session.usedLetters=new Set();return renderSpelling();}
 if(a==='spell-check'){const word=session.questions[session.q];if(session.built===word){earnCoin();return advance(renderSpelling);}wrong();return;}

 if(a==='bakery-cell'){const q=session.questions[session.q],idx=Number(b.dataset.index);if(q.op==='add'){if(session.stage===1){if(session.firstCells.has(idx))session.firstCells.delete(idx);else if(session.firstCells.size<q.a&&!session.secondCells.has(idx))session.firstCells.add(idx);}else{if(session.firstCells.has(idx))return;if(session.secondCells.has(idx))session.secondCells.delete(idx);else if(session.secondCells.size<q.b)session.secondCells.add(idx);}}else{if(idx>=q.a)return;if(session.removed.has(idx))session.removed.delete(idx);else if(session.removed.size<q.b)session.removed.add(idx);}return renderBakery();}
 if(a==='bakery-lock'){const q=session.questions[session.q];if(q.op!=='add'||session.firstCells.size!==q.a)return wrong('Build the first group first.');session.stage=2;return renderBakery();}
 if(a==='number-select'){session.selected=Number(b.dataset.number);if(session.room==='bakery')return renderBakery();if(session.room==='teen')return renderTeen();}
 if(a==='bakery-check'){const q=session.questions[session.q];const interaction=q.op==='add'?session.stage===2&&session.firstCells.size===q.a&&session.secondCells.size===q.b:session.removed.size===q.b;if(interaction&&session.selected===q.answer){earnCoin();session.orders++;session.q++;if(session.q>=8)return completeCurrent();setupBakeryQuestion();return renderBakery();}return wrong(interaction?'Choose the correct answer.':'Finish the ten frame first.');}
 if(a==='pattern-answer'){const q=session.questions[session.q];return handleCorrectChoice(b,String(b.dataset.answer)===String(q.answer),renderPattern);}
 if(a==='compare-number'){const n=Number(b.dataset.number),q=session.questions[session.q];if(![q.a,q.b].includes(n))return;if(q.a===q.b){session.tapped=session.tapped.length?[ ]:[n,n];}else if(session.tapped.includes(n))session.tapped=session.tapped.filter(x=>x!==n);else if(session.tapped.length<2)session.tapped.push(n);return renderCompare();}
 if(a==='compare-gator'){const q=session.questions[session.q],correct=q.a===q.b?'=':q.a>q.b?'>':'<';if(session.tapped.length<2)return wrong('Tap both numbers first.');return handleCorrectChoice(b,b.dataset.sign===correct,renderCompare);}
 if(a==='count-item'){const idx=Number(b.dataset.index);if(session.checked.has(idx))return;session.checked.add(idx);const mult=session.mode==='twos'?2:session.mode==='fives'?5:session.mode==='tens'?10:1;speak(String(session.checked.size*mult));return renderCount();}
 if(a==='count-number'){session.selected=Number(b.dataset.number);return renderCount();}
 if(a==='count-check'){const groups=session.questions[session.q];if(session.checked.size!==groups)return wrong('Tap every coin or group first.');if(session.selected!==countValue())return wrong('Choose the total on the number line.');earnCoin();session.q++;if(session.q>=8)return completeCurrent();session.checked=new Set();session.selected=null;session.coords=null;return renderCount();}

 if(a==='teen-one-cell'){const idx=Number(b.dataset.index);session.onesSet.has(idx)?session.onesSet.delete(idx):session.onesSet.add(idx);session.onesFilled=session.onesSet.size;return renderTeen();}
 if(a==='ten-cell'){const idx=Number(b.dataset.index);const mode=session.level===6?session.activeTeenMode:session.level;if(mode===0){if(idx===session.onesFilled)session.onesFilled++;else if(idx===session.onesFilled-1)session.onesFilled--;session.onesFilled=clamp(session.onesFilled,0,10);}else if(mode===1){const base=session.base;if(idx<base)return;const relative=idx-base;if(relative===session.onesFilled)session.onesFilled++;else if(relative===session.onesFilled-1)session.onesFilled--;session.onesFilled=clamp(session.onesFilled,0,10-base);}return renderTeen();}
 if(a==='fill-ten'){session.tenFilled=true;return renderTeen();}
 if(a==='base-add-ten'){session.baseTens=session.baseTens?0:1;return renderTeen();}
 if(a==='base-add-one'){session.baseOnes=clamp(session.baseOnes+1,0,10);return renderTeen();}
 if(a==='base-clear'){session.baseTens=0;session.baseOnes=0;return renderTeen();}
 if(a==='teen-model'){const target=session.questions[session.q];if(Number(b.dataset.number)!==target){b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);return wrong();}if(session.answered)return;session.answered=true;b.classList.add('correct');earnCoin();setTimeout(()=>{session.q++;if(session.q>=8)return completeCurrent();if(session.level===6)session.activeTeenMode=session.q%6;setupTeenQuestion();renderTeen();},420);return;}
 if(a==='teen-check'){const target=session.questions[session.q],mode=session.level===6?session.activeTeenMode:session.level;let ok=false;if(mode===0)ok=session.tenFilled&&session.onesFilled===target-10&&session.selected===target-10;else if(mode===1)ok=session.onesFilled===10-session.base&&session.selected===10-session.base;else if(mode===2||mode===3)ok=session.selected===session.expected;else if(mode===5)ok=session.baseTens===1&&session.baseOnes===target-10;if(ok){earnCoin();session.q++;if(session.q>=8)return completeCurrent();if(session.level===6)session.activeTeenMode=session.q%6;setupTeenQuestion();return renderTeen();}return wrong('Check the blocks and answer.');}

 if(a==='shape-match'){const target=session.questions[session.q];return handleCorrectChoice(b,b.dataset.name===target.name,renderShapeMatch);}
 if(a==='hunt-shape'){const idx=Number(b.dataset.index),target=session.questions[session.q];if(session.huntBoard[idx].name!==target.name)return;session.huntSelected.has(idx)?session.huntSelected.delete(idx):session.huntSelected.add(idx);return renderShapeHunt();}
 if(a==='hunt-check'){if(session.huntSelected.size===3){earnCoin();session.q++;if(session.q>=8)return completeCurrent();setupHunt();return renderShapeHunt();}return wrong('Find all three matching shapes.');}
 if(a==='shape-attr'){const q=session.questions[session.q];return handleCorrectChoice(b,Number(b.dataset.number)===q.answer,renderShapeAttr);}
 if(a==='shape-mixed-match'){const q=session.questions[session.q];return handleCorrectChoice(b,b.dataset.name===q.s.name,renderShapeMixed);}
 if(a==='shape-mixed-attr'){const q=session.questions[session.q];return handleCorrectChoice(b,Number(b.dataset.number)===q.answer,renderShapeMixed);}

 if(a==='clock-answer'){return handleCorrectChoice(b,b.dataset.answer===session.expected,renderClock);}
 if(a==='phone-key'){if(messenger.typed.length<messenger.target.length)messenger.typed+=b.dataset.key;return renderPhone();}
 if(a==='phone-back'){messenger.typed=messenger.typed.slice(0,-1);return renderPhone();}
 if(a==='phone-check'){if(messenger.typed===messenger.target){earnCoin();messenger.rep++;messenger.typed='';if(messenger.rep>=4){messenger.rep=0;messenger.part++;}if(messenger.part>=4){markDone('messenger',nav.level);return showCompletion('messenger',nav.level);}return renderPhone();}return wrong();}
 if(a==='address-answer'){if(b.dataset.answer===messenger.expected){earnCoin();messenger.rep++;if(messenger.rep>=4){messenger.rep=0;messenger.step++;}if(messenger.step>=ADDRESS_STEPS.length){markDone('messenger',2);return showCompletion('messenger',2);}return renderAddress();}return wrong();}
 if(a==='messenger-mixed-answer'){return handleCorrectChoice(b,b.dataset.answer===session.expected,renderMessengerMixed);}
 if(a==='mixed-phone-key'){if(session.mixedTyped.length<session.expected.length)session.mixedTyped+=b.dataset.key;return renderMessengerMixedPhone();}
 if(a==='mixed-phone-back'){session.mixedTyped=session.mixedTyped.slice(0,-1);return renderMessengerMixedPhone();}
 if(a==='mixed-phone-check'){if(session.mixedTyped===session.expected){earnCoin();session.q++;if(session.q>=8)return completeCurrent();return renderMessengerMixed();}return wrong();}

 if(a==='map-arrow'){const q=session.questions[session.pathIndex];if(session.entered.length<q.path.length)session.entered.push(b.dataset.key);return renderMap();}
 if(a==='map-back'){session.entered.pop();return renderMap();}
 if(a==='map-check'){const q=session.questions[session.pathIndex];let p={...q.start},bad=false;for(const m of session.entered){if(m==='R')p.x++;if(m==='L')p.x--;if(m==='U')p.y--;if(m==='D')p.y++;if(p.x<0||p.x>=q.size||p.y<0||p.y>=q.size||q.blocks.some(z=>z.x===p.x&&z.y===p.y)){bad=true;break;}}if(!bad&&p.x===q.goal.x&&p.y===q.goal.y){earnCoin();session.pathIndex++;session.entered=[];if(session.pathIndex>=session.questions.length)return completeCurrent();return renderMap();}return wrong(q.blocks.length?'Try a path that reaches the treasure without hitting a rock.':'Try a path that reaches the treasure.');}
});

// Start cleanly. Old app storage is intentionally not imported because it contained conflicting completion states.
updateStats();showHome();

})();

  </script>
