<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Princess Castle Academy</title>
<style>
:root{--ink:#3b1c58;--purple:#7f35c9;--lav:#dcb7ff;--pink:#ec62c9;--gold:#ffe58b;--cream:#fff9df;--blue:#e7f5ff;--green:#eaffea}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eaf6ff;color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;overscroll-behavior:none}body{overflow:hidden}.app{height:100dvh;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#e3f6ff,#fbe8ff)}button{font-family:inherit;color:var(--ink);font-weight:900;border:none;touch-action:manipulation}.hidden{display:none!important}.topbar{height:92px;flex:0 0 auto;background:rgba(238,249,255,.96);border-bottom:4px solid #b7daf8;display:flex;align-items:center;gap:10px;padding:8px 14px}.title{font-size:clamp(1.15rem,3.7vw,2.5rem);font-weight:900;text-shadow:0 2px white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.stat{min-width:92px;height:58px;border-radius:30px;border:5px solid #e4bdec;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(1.25rem,3.5vw,2rem);font-weight:900}.portalBtn{width:64px;height:58px;border-radius:28px;border:5px solid #e4bdec;background:#fff;font-size:1.7rem}.screen{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background-size:cover;background-position:center;border-top:7px solid rgba(255,255,255,.8)}.screen:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.06);pointer-events:none}.layer{position:relative;z-index:1;height:100%;padding:12px;overflow:auto}.btn{border-radius:22px;border:5px solid #b86bee;background:linear-gradient(#fff,#fff4b7);box-shadow:0 8px 0 var(--purple),0 12px 18px rgba(0,0,0,.13);padding:12px 18px;font-size:clamp(1.05rem,3vw,1.7rem)}.btn:active{transform:translateY(3px);box-shadow:0 5px 0 var(--purple)}.smallBtn{font-size:1.1rem;padding:9px 12px}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:10px}.barTitle{background:rgba(255,255,255,.94);border:5px solid #dcb7ff;border-radius:30px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.35rem,4vw,2.6rem);font-weight:900;padding:8px 14px}.barProgress{background:rgba(255,255,255,.94);border:5px solid #dcb7ff;border-radius:28px;min-height:62px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;padding:8px 12px}.homePanel{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px}.welcome{background:rgba(255,255,255,.92);border:5px solid #dcb7ff;border-radius:30px;padding:12px;text-align:center;font-size:clamp(1.3rem,4vw,2.6rem);font-weight:900}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:center}.door{min-height:128px;border-radius:26px;border:5px solid #dcb7ff;background:linear-gradient(#fff7d5,#ffd6f6);box-shadow:0 8px 0 var(--purple);font-size:clamp(1rem,2.7vw,1.5rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.door .emoji{font-size:2.7rem}.panel{background:rgba(255,255,255,.94);border:6px solid #dfc1ff;border-radius:32px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.12)}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.levelCard{min-height:160px;border-radius:24px;border:5px solid #dcb7ff;background:rgba(255,255,255,.94);box-shadow:0 8px 0 var(--purple);padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:1.2rem;font-weight:900}.levelCard.locked{opacity:.55;filter:grayscale(1);box-shadow:0 8px 0 #aaa}.stars{color:#e4aa00;letter-spacing:1px}.gameShell{height:calc(100% - 82px);min-height:0;display:flex;flex-direction:column;gap:10px}.scene{flex:1;min-height:230px;border:6px solid #fff1a9;border-radius:30px;position:relative;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 9999px rgba(255,255,255,.04)}.sceneSoft{background:rgba(240,250,255,.68);position:absolute;inset:0}.spark{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.76);border:5px solid #ffd2f7;box-shadow:0 0 28px 10px rgba(236,98,201,.58);display:grid;place-items:center;font-size:2rem;z-index:4;animation:pulse 1.3s infinite}.spark.used{visibility:hidden}.spark:before{content:"✨"}@keyframes pulse{50%{transform:scale(1.15)}}.dock{flex:0 0 auto;background:rgba(255,255,255,.94);border:6px solid #dfc1ff;border-radius:30px;padding:10px}.chestGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.chest{min-height:82px;border:5px solid #8a551b;border-radius:22px 22px 16px 16px;background:linear-gradient(#ffe894 0 24%,#c77b25 24% 55%,#ffd573 55%);box-shadow:0 8px 0 #71400d;display:grid;place-items:center;font-size:clamp(1.1rem,3vw,1.8rem);font-weight:900;color:var(--ink)}.instruction{text-align:center;font-size:clamp(1rem,3vw,1.7rem);font-weight:900;margin-top:6px}.modal{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:rgba(45,25,65,.25);backdrop-filter:blur(1px)}.challenge{width:min(94%,850px);max-height:94%;overflow:auto;background:rgba(255,255,255,.97);border:7px solid #dbabff;border-radius:34px;padding:18px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)}.challenge h2{font-size:clamp(1.5rem,5vw,3rem);margin:6px 0 14px}.prompt{font-size:clamp(1.35rem,4.6vw,2.8rem);font-weight:900;background:#fff;border:5px solid #e0c0ff;border-radius:28px;padding:14px;margin:8px auto 16px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices.two{grid-template-columns:repeat(2,1fr)}.choice{min-height:118px;border-radius:26px;border:5px solid #bd72ee;background:linear-gradient(#fff,#fff5ca);box-shadow:0 8px 0 var(--purple);font-size:clamp(1.25rem,4vw,2.3rem);display:grid;place-items:center;padding:10px}.choice.same{min-width:0}.choice:active{transform:translateY(3px);box-shadow:0 5px 0 var(--purple)}.msg{min-height:36px;font-size:clamp(1.1rem,3vw,1.8rem);font-weight:900;color:#8b35cc;margin-top:10px}.shake{animation:shake .35s}.hint{outline:8px solid #ffd745;animation:hint 1s infinite}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-8px)}}@keyframes hint{50%{transform:scale(1.04);filter:brightness(1.16)}}.popStar{position:absolute;z-index:70;font-size:4rem;animation:pop .8s forwards;pointer-events:none}@keyframes pop{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.35);opacity:1}100%{transform:scale(.85);opacity:0}}.complete{position:absolute;z-index:80;inset:8%;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.97);border:8px solid #dfb0ff;border-radius:38px;padding:20px;font-size:clamp(1.5rem,5vw,3rem);font-weight:900;box-shadow:0 20px 40px rgba(0,0,0,.24)}
/* reading pictures */.pictureCard{height:150px;width:100%;border-radius:20px;background:linear-gradient(#dff7ff,#eaffdc);position:relative;overflow:hidden;border:4px solid #ead0ff}.picObj{position:absolute;font-size:3.6rem;filter:drop-shadow(0 5px 4px rgba(0,0,0,.16))}.obj1{left:31%;top:54%;transform:translate(-50%,-50%)}.obj2{left:68%;top:55%;transform:translate(-50%,-50%)}.ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:#c9f0be}.bigObj{font-size:4.6rem}.mudShape{position:absolute;width:96px;height:40px;border-radius:50%;background:#8b5e3c;left:68%;top:62%;transform:translate(-50%,-50%)}.boxShape{font-size:4.8rem}.logShape{font-size:4.6rem}.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:560px;margin:10px auto}.cell{aspect-ratio:1;border:5px solid #7331bd;border-radius:18px;background:white;display:grid;place-items:center;font-size:2rem;box-shadow:0 5px 0 #b166eb}.cell.filled{background:#fff9dc}.dragonRow{display:flex;justify-content:center;align-items:center;gap:14px;font-size:clamp(1.5rem,5vw,3rem);font-weight:900}.dragon{font-size:4.4rem}.answerNums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:540px;margin:12px auto}.numChoice{min-height:60px;border-radius:18px;border:4px solid #b86bee;background:#fff5ca;box-shadow:0 5px 0 #7f35c9;font-size:2rem}.selectedNum{outline:7px solid #ffd745}.serveBtn{font-size:clamp(1.4rem,4vw,2.4rem);padding:14px 26px}.patternLine{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);font-size:clamp(2.4rem,8vw,4.6rem);margin:24px 0}.blankBox{width:clamp(62px,14vw,100px);height:clamp(62px,14vw,100px);border:6px dashed #a64de7;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.78);font-size:3rem}.calendarStack{display:grid;gap:10px}.monthArt{border-radius:24px;border:5px solid white;min-height:140px;background:linear-gradient(#95dcff 0 35%,#fff3a4 36% 67%,#9bd57a 68%);display:grid;place-items:center;font-size:4rem;overflow:hidden}.cal{background:white;border:5px solid #c584f2;border-radius:24px;padding:10px}.cal h2{margin:0 0 6px;text-align:center;font-size:clamp(1.7rem,5vw,3rem)}.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.dow{font-size:clamp(1rem,3vw,1.6rem);font-weight:900}.dayCell{height:42px;border-radius:11px;background:#f7edff;display:grid;place-items:center;font-size:clamp(1rem,3.2vw,1.75rem);font-weight:900;position:relative}.dayCell.today:after{content:'⭐';position:absolute;inset:0;display:grid;place-items:center;font-size:2.15rem;opacity:.48;filter:drop-shadow(0 0 3px #b06cff);pointer-events:none}.refs{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:8px}.ref{border:3px solid #bb74ed;border-radius:14px;background:#fff;padding:6px 9px;font-weight:900}.equalChoices{grid-template-columns:repeat(3,1fr)}.equalChoices .choice{width:100%;min-width:0;font-size:clamp(1rem,3.5vw,2.1rem)}.slotRow,.tileRow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0}.slot,.tile{width:78px;height:78px;border:5px solid #8e3ad2;border-radius:20px;background:white;box-shadow:0 6px 0 #b16cf0;display:grid;place-items:center;font-size:2.4rem;font-weight:900}.tile{background:#fff2b4}.speaker{border-radius:22px;border:5px solid #b86bee;background:#fff;font-size:1.7rem;padding:8px 15px}.noShadow{box-shadow:none!important}
@media(max-width:700px){.topbar{height:88px;padding:8px}.stat{min-width:86px;height:56px}.portalBtn{display:none}.layer{padding:10px}.bar{grid-template-columns:auto 1fr}.barProgress{display:none}.barTitle{min-height:68px}.doors{grid-template-columns:repeat(2,1fr)}.door{min-height:118px}.levels{grid-template-columns:repeat(2,1fr)}.scene{min-height:250px}.choices{gap:10px}.choice{min-height:96px;padding:6px}.chestGrid{grid-template-columns:repeat(2,1fr)}.pictureCard{height:130px}.calendarStack{font-size:.95rem}.dayCell{height:35px}.equalChoices{gap:8px}.challenge{padding:13px}.monthArt{min-height:115px}.answerNums{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="title">🏰 Princess Castle Academy</div><div class="stat">💎 <span id="gems">0</span></div><div class="stat">🪙 <span id="coins">0</span></div><button class="portalBtn" onclick="showParent()">🔒</button></header>
<main id="screen" class="screen"><div id="layer" class="layer"></div></main>
</div>
<script>
const $=id=>document.getElementById(id); const $$=sel=>Array.from(document.querySelectorAll(sel));
const rooms={clock:{name:'Clock Tower',emoji:'🕰️',bg:'clock.jpg'},reading:{name:'Reading Adventure',emoji:'📚',bg:'reading.jpg'},rhyme:{name:'Rhyming Treasure',emoji:'💎',bg:'rhyme.jpg'},word:{name:'Wizard Tower',emoji:'🔮',bg:'word.jpg'},bakery:{name:'Royal Bakery',emoji:'🧁',bg:'bakery.jpg'},pattern:{name:'Pattern Garden',emoji:'🌷',bg:'pattern.jpg'},sight:{name:'Sight Word Ballroom',emoji:'👑',bg:'castle-scene.png'}};
const levels={
  sight:[{title:'First Words',words:['me','he','do','go','no']},{title:'Early Words',words:['my','can','you','we','see']},{title:'More Words',words:['and','the','a','I','is']},{title:'Fun Words',words:['cat','dog','pig','bug','hat']}],
  rhyme:[{title:'CAT vs DOG',chests:['CAT','DOG'],items:{CAT:['hat','bat','mat','rat'],DOG:['log','hog','jog','fog']}},{title:'PAN vs BUG',chests:['PAN','BUG'],items:{PAN:['fan','man','van','can'],BUG:['rug','mug','hug','tug']}},{title:'SUN vs HEN',chests:['SUN','HEN'],items:{SUN:['fun','run','bun'],HEN:['ten','pen','den']}}],
  reading:[{title:'Things I See',pages:[['I see a cat.',['cat'],[['cat'],['dog'],['pig']]],['I see a dog.',['dog'],[['dog'],['cat'],['pig']]],['I see a pig.',['pig'],[['pig'],['cat'],['dog']]],['I see a bug.',['bug'],[['bug'],['dog'],['cat']]]]},
  {title:'Two Things',pages:[['I see a cat and a box.',['cat','box'],[['cat','box'],['dog','box'],['cat','dog']]],['I see a dog and a log.',['dog','log'],[['dog','log'],['cat','log'],['dog','box']]],['I see a pig and mud.',['pig','mud'],[['pig','mud'],['dog','mud'],['pig','log']]],['I see a bug and a hat.',['bug','hat'],[['bug','hat'],['cat','hat'],['bug','box']]]]},
  {title:'More Things',pages:[['I see a cat and a hat.',['cat','hat'],[['cat','hat'],['dog','hat'],['cat','box']]],['I see a dog and a box.',['dog','box'],[['dog','box'],['cat','box'],['dog','log']]],['I see a pig and a log.',['pig','log'],[['pig','log'],['bug','log'],['pig','mud']]],['I see a bug and mud.',['bug','mud'],[['bug','mud'],['pig','mud'],['bug','hat']]]]}],
  word:[{title:'-AT Family',words:['cat','hat','bat','mat','rat']},{title:'-AN Family',words:['can','fan','man','pan','van']},{title:'-OP Family',words:['hop','mop','top','pop','cop']},{title:'-IN Family',words:['pin','fin','win','tin','bin']}],
  pattern:[{title:'AB Patterns',type:'AB',count:7},{title:'AAB Patterns',type:'AAB',count:7},{title:'ABB Patterns',type:'ABB',count:7},{title:'ABC Patterns',type:'ABC',count:8}],
  clock:[{title:"Today's Calendar",type:'today'},{title:'Days of the Week',type:'days'},{title:'Months',type:'months'},{title:'Seasons',type:'seasons'}],
  bakery:[{title:'Bakery Orders',type:'mixed'}]
};
const sparkPositions=[[16,28],[30,21],[46,31],[62,22],[78,32],[22,55],[39,59],[56,54],[73,60],[13,72],[31,77],[49,75],[68,73],[85,70],[52,16],[37,43]];
const defaultState={coins:0,gems:0,unlocked:{sight:1,rhyme:1,reading:1,word:1,pattern:1,clock:1,bakery:1},completed:{},stats:{}};
let state=JSON.parse(localStorage.getItem('pca_final_state')||'null')||structuredClone(defaultState);
function save(){localStorage.setItem('pca_final_state',JSON.stringify(state));updateTop()} function updateTop(){$('coins').textContent=state.coins;$('gems').textContent=state.gems}
function setBg(file){$('screen').style.backgroundImage=`url('assets/backgrounds/${file}')`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.78;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function addCoin(n=1){state.coins+=n;save()} function addGem(n=1){state.gems+=n;save()}
function bar(room,title,progress=''){return `<div class="bar"><button class="btn smallBtn" onclick="showLevels('${room}')">⬅️ Levels</button><div class="barTitle">${rooms[room].emoji} ${title}</div><div class="barProgress">${progress}</div></div>`}
function showHome(){setBg('home.jpg');$('layer').innerHTML=`<div class="homePanel"><div class="welcome">Choose a room to begin your adventure!</div><div class="doors">${Object.entries(rooms).map(([k,r])=>`<button class="door" onclick="showLevels('${k}')"><div class="emoji">${r.emoji}</div><div>${r.name}</div><small>Level ${state.unlocked[k]||1}</small></button>`).join('')}</div></div>`;updateTop()}
function showLevels(room){setBg(room==='sight'?'castlehall.jpg':rooms[room].bg);let list=levels[room];$('layer').innerHTML=bar(room,rooms[room].name,'')+`<div class="panel"><div class="levels">${list.map((lv,i)=>{let locked=i+1>(state.unlocked[room]||1);let comp=state.completed[room+'_'+i]||0;return `<button class="levelCard ${locked?'locked':''}" onclick="${locked?'':'startLevel(\''+room+'\','+i+')'}"><div style="font-size:2rem">${locked?'🔒':rooms[room].emoji}</div><div>Level ${i+1}<br>${lv.title}</div><div class="stars">${'★'.repeat(Math.min(3,comp))}${'☆'.repeat(3-Math.min(3,comp))}</div></button>`}).join('')}</div></div>`}
function startLevel(room,i){if(room==='sight')startQuest('sight',i); if(room==='rhyme')startQuest('rhyme',i); if(room==='reading')startReading(i); if(room==='word')startWord(i); if(room==='pattern')startPattern(i); if(room==='bakery')startBakery(); if(room==='clock')startClock(i)}
function markComplete(room,i){state.completed[room+'_'+i]=(state.completed[room+'_'+i]||0)+1;if((state.unlocked[room]||1)===i+1 && levels[room][i+1])state.unlocked[room]=i+2;addGem(1);save();showComplete(`${rooms[room].emoji} Level Complete!`,`+1 gem`,()=>showLevels(room))}
function showComplete(title,sub,cb){let div=document.createElement('div');div.className='complete';div.innerHTML=`<div>🎉<br>${title}<br><span style="font-size:.65em">${sub}</span><br><button class="btn" style="margin-top:18px">Continue</button></div>`;div.querySelector('button').onclick=()=>{div.remove();cb&&cb()};document.body.appendChild(div)}
function showSparkle(x,y){let s=document.createElement('div');s.className='popStar';s.style.left=x+'px';s.style.top=y+'px';s.textContent='✨';document.body.appendChild(s);setTimeout(()=>s.remove(),900)}
// QUEST STYLE ROOMS: sight and rhyme
let quest={};
function questItems(room,i){if(room==='sight'){let words=levels.sight[i].words;return {title:levels.sight[i].title,chests:words.map(w=>w.toUpperCase()),items:shuffle(words.map(w=>({display:w,answer:w.toUpperCase(),audio:null}))).concat(shuffle(words.map(w=>({display:w,answer:w.toUpperCase(),audio:null}))).slice(0,Math.max(0,10-words.length)))} }
 let lv=levels.rhyme[i],items=[];lv.chests.forEach(c=>lv.items[c].forEach(w=>items.push({display:w,answer:c,audio:w})));return {title:lv.title,chests:lv.chests,items:shuffle(items)};
}
function startQuest(room,i){setBg(room==='sight'?'castle-scene.png':rooms[room].bg);let data=questItems(room,i);quest={room,i,data,remaining:data.items,found:0,active:null,attempts:0,used:new Set()};renderQuest()}
function renderQuest(){let r=quest.room;let total=quest.remaining.length;let bg=r==='sight'?'castle-scene.png':rooms[r].bg;$('layer').innerHTML=bar(r,quest.data.title,`${quest.found} / ${total}`)+`<div class="gameShell"><div id="questScene" class="scene" style="background-image:url('assets/backgrounds/${bg}')"></div><div class="dock"><div class="chestGrid">${quest.data.chests.map(c=>`<button class="chest" id="chest-${c}" onclick="chooseQuest('${c}')">${c}</button>`).join('')}</div><div class="instruction">Find a sparkle. Then choose the matching chest.</div><div class="msg" id="questMsg"></div></div></div>`;let scene=$('questScene');let positions=sparkPositions.slice(0,total);positions.forEach((p,idx)=>{let b=document.createElement('button');b.className='spark';b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.onclick=()=>tapQuestSpark(idx,b);scene.appendChild(b)})}
function tapQuestSpark(idx,btn){if(quest.active||quest.used.has(idx))return;quest.active=quest.remaining[idx];quest.activeIndex=idx;quest.attempts=0;btn.classList.add('used');let rect=btn.getBoundingClientRect();showSparkle(rect.left+27,rect.top+27);let item=quest.active;if(item.audio)setTimeout(()=>speak(item.audio),120);$('questMsg').innerHTML=`<div style="font-size:2rem;background:white;border:5px solid #e5c1ff;border-radius:24px;display:inline-block;padding:8px 18px">${item.audio?'🔊 ':''}${item.display}</div>`}
function chooseQuest(chest){if(!quest.active){$('questMsg').textContent='Tap a sparkle first!';return}if(chest===quest.active.answer){addCoin(1);quest.used.add(quest.activeIndex);quest.found++;let c=$('chest-'+chest);c.classList.add('hint');setTimeout(()=>c.classList.remove('hint'),450);quest.active=null;$('questMsg').textContent='Great treasure!';if(quest.found>=quest.remaining.length)setTimeout(()=>markComplete(quest.room,quest.i),700);else setTimeout(()=>{$('questMsg').textContent='Find another sparkle!'},700)}else{quest.attempts++;$('questMsg').textContent=quest.attempts>=2?'Look for the glowing chest.':'Try again!';let wrong=$('chest-'+chest);wrong.classList.add('shake');setTimeout(()=>wrong.classList.remove('shake'),400);if(quest.attempts>=2)$('chest-'+quest.active.answer).classList.add('hint')}}
// Reading with literal object combinations
const objEmoji={cat:'🐱',dog:'🐶',pig:'🐷',bug:'🐞',box:'📦',log:'🪵',hat:'🎩',mud:'mud'};
let read={};function startReading(i){setBg('reading.jpg');read={i,level:levels.reading[i],found:0,active:null,used:new Set(),attempts:0};renderReadingScene()}
function renderReadingScene(){let total=read.level.pages.length;$('layer').innerHTML=bar('reading',read.level.title,`${read.found} / ${total}`)+`<div class="gameShell"><div id="readScene" class="scene" style="background-image:url('assets/backgrounds/reading.jpg')"></div><div class="dock"><div class="instruction">Find a sparkling story page.</div><div class="msg" id="readDockMsg"></div></div></div>`;let scene=$('readScene');sparkPositions.slice(0,total).forEach((p,idx)=>{let b=document.createElement('button');b.className='spark';b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.onclick=()=>tapRead(idx,b);scene.appendChild(b)})}
function tapRead(idx,btn){if(read.active||read.used.has(idx))return;read.activeIndex=idx;read.active=read.level.pages[idx];read.attempts=0;btn.classList.add('used');let r=btn.getBoundingClientRect();showSparkle(r.left+27,r.top+27);showReadingChallenge()}
function pic(combo){return `<div class="pictureCard"><div class="ground"></div>${combo.map((o,j)=> o==='mud'?`<div class="mudShape"></div>`:`<div class="picObj ${j?'obj2':'obj1'} ${o==='box'?'boxShape':o==='log'?'logShape':'bigObj'}">${objEmoji[o]||'✨'}</div>`).join('')}</div>`}
function showReadingChallenge(){let [sent,ans,choices]=read.active;let div=document.createElement('div');div.className='modal';div.id='readModal';div.innerHTML=`<div class="challenge"><div class="prompt"><div style="font-size:.58em">Read the sentence. Choose the matching picture.</div><br>${sent}</div><div class="choices">${shuffle(choices).map((c,idx)=>`<button class="choice" id="readChoice${idx}" onclick='chooseReading(${JSON.stringify(c)},${JSON.stringify(ans)},${idx})'>${pic(c)}</button>`).join('')}</div><div class="msg" id="readMsg"></div></div>`;document.body.appendChild(div)}
function sameCombo(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function chooseReading(c,ans,idx){if(sameCombo(c,ans)){addCoin(1);read.used.add(read.activeIndex);read.found++;$('readModal').remove();read.active=null;if(read.found>=read.level.pages.length)setTimeout(()=>markComplete('reading',read.i),400);else $('readDockMsg').textContent='Find another story page!'}else{read.attempts++;$('readMsg').textContent=read.attempts>=2?'Look for the picture with exactly those things.':'Try again!';let b=$('readChoice'+idx);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(read.attempts>=2){$$('#readModal .choice').forEach(btn=>{if(btn.getAttribute('onclick').includes(JSON.stringify(ans)))btn.classList.add('hint')})}}}
// Pattern Garden
let pat={};const patternSets=[['🌷','🌻','🦋'],['💎','🌻','🍄'],['🌹','🌼','🦋'],['👑','💎','🌷']];function startPattern(i){setBg('pattern.jpg');pat={i,q:0,total:levels.pattern[i].count,attempts:0};nextPattern()}function makePat(type){let set=shuffle(patternSets)[0],A=set[0],B=set[1],C=set[2];let seq,ans;if(type==='AB'){seq=[A,B,A,B];ans=A}else if(type==='AAB'){seq=[A,A,B,A,A];ans=B}else if(type==='ABB'){seq=[A,B,B,A];ans=B}else{seq=[A,B,C,A,B];ans=C}return {seq,ans,choices:shuffle([ans, ans===A?B:A, set.find(x=>x!==A&&x!==B&&x!==C)||'🍄']).slice(0,3),A,B,C}}
function nextPattern(){pat.current=makePat(levels.pattern[pat.i].type);pat.attempts=0;renderPattern()}
function renderPattern(){let p=pat.current;$('layer').innerHTML=bar('pattern',levels.pattern[pat.i].title,`${pat.q+1} / ${pat.total}`)+`<div class="gameShell"><div class="scene" style="background-image:url('assets/backgrounds/pattern.jpg')"><div class="sceneSoft"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="challenge" style="position:relative;width:min(92%,850px)"><h2>Fix the flower bed.</h2><div class="patternLine">${p.seq.map(x=>`<span>${x}</span>`).join('')}<span class="blankBox">?</span></div><div class="choices">${p.choices.map((c,idx)=>`<button class="choice" id="pat${idx}" onclick="choosePattern('${c}',${idx})">${c}</button>`).join('')}</div><div class="msg" id="patMsg"></div></div></div></div></div>`}
function choosePattern(c,idx){if(c===pat.current.ans){addCoin(1);pat.q++;if(pat.q>=pat.total)markComplete('pattern',pat.i);else nextPattern()}else{pat.attempts++;$('patMsg').textContent=pat.attempts>=2?'Look for the glowing choice.':'Try again!';let b=$('pat'+idx);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(pat.attempts>=2)$$('.choice').forEach(x=>{if(x.textContent.trim()===pat.current.ans)x.classList.add('hint')})}}
// Bakery: clickable ten frame, Order Up, answer choices
let bak={};function startBakery(){setBg('bakery.jpg');bak={served:0,stage:'first',a:0,b:0,icon1:'🧁',icon2:'🍬',filled:[],selected:null,attempts:0};newOrder()}
function newOrder(){let total=Math.floor(Math.random()*8)+2;let a=Math.floor(Math.random()*(total-1))+1;let b=total-a;if(Math.random()<.35){b=0;a=total}bak.a=a;bak.b=b;bak.icon1=shuffle(['🧁','🍓','🍪','🍩'])[0];bak.icon2=shuffle(['🍋','🍬','🫐','🍒']).find(x=>x!==bak.icon1)||'🍬';bak.stage='first';bak.filled=[];bak.selected=null;bak.attempts=0;renderBakery()}
function renderBakery(){let target=bak.stage==='first'?bak.a:bak.b, icon=bak.stage==='first'?bak.icon1:bak.icon2;let total=bak.a+bak.b;let prompt=bak.b? (bak.stage==='first'?`The big dragon wants ${bak.a} ${bak.icon1}`:`The baby dragon wants ${bak.b} ${bak.icon2}`):`The dragon wants ${bak.a} ${bak.icon1}`;let showEquation=bak.stage==='answer';$('layer').innerHTML=bar('bakery','Bakery Orders',`Orders: ${bak.served}`)+`<div class="gameShell"><div class="scene" style="background-image:url('assets/backgrounds/bakery.jpg')"><div class="sceneSoft"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="challenge" style="position:relative;width:min(92%,850px)"><div class="dragonRow"><span class="dragon">${bak.stage==='second'?'🐲':'🐉'}</span><span>${showEquation?`${bak.a} + ${bak.b} = ?`:prompt}</span></div><div class="tenframe">${Array.from({length:10},(_,i)=>`<button class="cell ${bak.filled[i]?'filled':''}" onclick="toggleCell(${i})">${bak.filled[i]||''}</button>`).join('')}</div>${showEquation?`<div class="answerNums">${answerChoices(total).map(n=>`<button class="numChoice ${bak.selected===n?'selectedNum':''}" onclick="selectAnswer(${n})">${n}</button>`).join('')}</div>`:''}<button class="btn serveBtn" onclick="orderUp()">🔔 Order Up!</button><div class="msg" id="bakMsg"></div></div></div></div></div>`}
function toggleCell(i){if(bak.stage==='answer')return;let icon=bak.stage==='first'?bak.icon1:bak.icon2;if(bak.filled[i]){ if((bak.stage==='first'&&bak.filled[i]===bak.icon1)||(bak.stage==='second'&&bak.filled[i]===bak.icon2)) bak.filled[i]=''; } else bak.filled[i]=icon;renderBakery()}
function countIcon(icon){return bak.filled.filter(x=>x===icon).length}
function orderUp(){if(bak.stage==='first'){if(countIcon(bak.icon1)===bak.a){if(bak.b){bak.stage='second';bak.attempts=0;renderBakery()}else finishOrder()}else wrongBakery(`The dragon asked for ${bak.a}. Count carefully, then ring the bell.`)}else if(bak.stage==='second'){if(countIcon(bak.icon2)===bak.b){bak.stage='answer';bak.attempts=0;bak.selected=null;renderBakery()}else wrongBakery(`The baby dragon asked for ${bak.b}. Count carefully, then ring the bell.`)}else if(bak.stage==='answer'){if(bak.selected===bak.a+bak.b)finishOrder();else wrongBakery('Choose the total at the bottom before ringing the bell.')}}
function wrongBakery(msg){bak.attempts++;$('bakMsg').textContent=bak.attempts>=2?msg:'Try again!';document.querySelector('.challenge').classList.add('shake');setTimeout(()=>document.querySelector('.challenge')?.classList.remove('shake'),400)}
function selectAnswer(n){bak.selected=n;renderBakery()}function answerChoices(ans){let set=new Set([ans]);while(set.size<10)set.add(Math.floor(Math.random()*10)+1);return [...set].sort((a,b)=>a-b)}function finishOrder(){addCoin(1);bak.served++;let div=document.createElement('div');div.className='modal';div.innerHTML=`<div class="challenge"><h2>🎉 Order Served!</h2><div class="prompt">${bak.b?`${bak.a} + ${bak.b} = ${bak.a+bak.b}`:`${bak.a} treats served!`}</div><button class="btn" onclick="this.closest('.modal').remove(); newOrder();">Continue</button></div>`;document.body.appendChild(div);if(bak.served>0&&bak.served%5===0)addGem(1)}
// Word builder
let wb={};const wordPics={cat:'🐱',hat:'🎩',bat:'🦇',mat:'▭',rat:'🐀',can:'🥫',fan:'🪭',man:'👨',pan:'🍳',van:'🚐',hop:'🐰',mop:'🧹',top:'🔝',pop:'🎈',cop:'👮',pin:'📌',fin:'🐟',win:'🏆',tin:'🥫',bin:'🗑️'};function startWord(i){setBg('word.jpg');wb={i,words:levels.word[i].words,q:0,slots:['','',''],tiles:[],attempts:0};nextWord()}function nextWord(){wb.word=wb.words[wb.q];wb.slots=['','',''];wb.tiles=shuffle(wb.word.toUpperCase().split(''));wb.attempts=0;renderWord()}function renderWord(){$('layer').innerHTML=bar('word',levels.word[wb.i].title,`${wb.q+1} / ${wb.words.length}`)+`<div class="gameShell"><div class="scene" style="background-image:url('assets/backgrounds/word.jpg')"><div class="sceneSoft"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="challenge"><button class="speaker" onclick="speak('${wb.word}')">🔊</button><h2>${wordPics[wb.word]||'✨'}</h2><div class="slotRow">${wb.slots.map((s,i)=>`<button class="slot" onclick="removeLetter(${i})">${s}</button>`).join('')}</div><div class="tileRow">${wb.tiles.map((t,i)=>`<button class="tile" onclick="addLetter(${i})">${t}</button>`).join('')}</div><div class="msg" id="wordMsg"></div></div></div></div></div>`}
function addLetter(i){let e=wb.slots.indexOf('');if(e<0)return;wb.slots[e]=wb.tiles.splice(i,1)[0];renderWord();if(!wb.slots.includes(''))setTimeout(checkWord,150)}function removeLetter(i){if(wb.slots[i]){wb.tiles.push(wb.slots[i]);wb.slots[i]='';renderWord()}}function checkWord(){if(wb.slots.join('').toLowerCase()===wb.word){addCoin(1);wb.q++;if(wb.q>=wb.words.length)markComplete('word',wb.i);else nextWord()}else{wb.attempts++;$('wordMsg').textContent=wb.attempts>=2?'Try moving the letters.':'Try again!';document.querySelector('.slotRow').classList.add('shake');setTimeout(()=>document.querySelector('.slotRow')?.classList.remove('shake'),400)}}
// Clock Tower
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const months=['January','February','March','April','May','June','July','August','September','October','November','December'];function info(){let d=new Date();return {d,day:days[d.getDay()],tom:days[(d.getDay()+1)%7],yes:days[(d.getDay()+6)%7],mon:months[d.getMonth()],prevMon:months[(d.getMonth()+11)%12],nextMon:months[(d.getMonth()+1)%12],date:d.getDate(),year:d.getFullYear()}}
let clk={};function startClock(i){setBg('clock.jpg');clk={i,q:0,attempts:0,qs:makeClockQs(i)};renderClock()}
function makeClockQs(i){let x=info();if(i===0)return [['Today is...',x.day,[x.day,x.tom,x.yes]],['Tomorrow is...',x.tom,[x.tom,x.day,x.yes]],['Yesterday was...',x.yes,[x.yes,x.day,x.tom]],['The month is...',x.mon,[x.mon,x.nextMon,x.prevMon]],['The date is...',String(x.date),[String(x.date),String(x.date+1),String(Math.max(1,x.date-1))]],['The year is...',String(x.year),[String(x.year),String(x.year-1),String(x.year+1)]]];
 if(i===1){let qs=[];for(let k=0;k<7;k++){qs.push([`If today is ${days[k]}, tomorrow is...`,days[(k+1)%7],[days[(k+1)%7],days[k],days[(k+6)%7]]]);qs.push([`If today is ${days[k]}, yesterday was...`,days[(k+6)%7],[days[(k+6)%7],days[k],days[(k+1)%7]]]);}return shuffle(qs).slice(0,8)}
 if(i===2){let qs=[];for(let k=0;k<12;k++){qs.push([`After ${months[k]} comes...`,months[(k+1)%12],[months[(k+1)%12],months[k],months[(k+11)%12]]]);qs.push([`Before ${months[k]} was...`,months[(k+11)%12],[months[(k+11)%12],months[k],months[(k+1)%12]]]);}return shuffle(qs).slice(0,8)}
 return shuffle([['Summer is...','hot',['hot','cold','snowy']],['Winter is...','cold',['cold','hot','rainbow']],['In summer we wear...','bathing suits',['bathing suits','coats','mittens']],['In winter we wear...','coats',['coats','bathing suits','shorts']],['Pumpkins remind us of...','Fall',['Fall','Summer','Winter']],['Flowers bloom in...','Spring',['Spring','Winter','Fall']]]);
}
function calHTML(){let x=info(),d=x.d,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let labels=['S','M','Tu','W','Th','F','S'];let cells=labels.map(l=>`<div class="dow">${l}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=last;n++)cells+=`<div class="dayCell ${n===x.date?'today':''}">${n}</div>`;return `<div class="calendarStack"><div class="monthArt">${monthEmoji(m)}</div><div class="cal"><h2>${x.mon} ${y}</h2><div class="calGrid">${cells}</div></div></div>`}
function monthEmoji(m){return ['❄️☃️','💘❄️','🌷☔','🌦️🌸','🌼🦋','☀️🏰🌷','🎆☀️','🏖️☀️','🍎📚','🎃🍂','🦃🍁','🎄❄️'][m]}
function refHTML(i){if(i===1)return `<div class="refs">${days.map(d=>`<span class="ref">${d}</span>`).join('')}</div>`;if(i===2)return `<div class="refs">${months.map(m=>`<span class="ref">${m}</span>`).join('')}</div>`;return `<div class="monthArt">${clk.qs[clk.q][0].includes('summer')||clk.qs[clk.q][0].includes('Summer')?'☀️🏖️':clk.qs[clk.q][0].includes('winter')||clk.qs[clk.q][0].includes('Winter')?'❄️🧥':clk.qs[clk.q][0].includes('Pumpkins')?'🎃🍂':'🌸🌷'}</div>`}
function renderClock(){let [prompt,ans,choices]=clk.qs[clk.q];let ref=clk.i===0?calHTML():refHTML(clk.i);$('layer').innerHTML=bar('clock',levels.clock[clk.i].title,`${clk.q+1} / ${clk.qs.length}`)+`<div class="gameShell"><div class="scene" style="background-image:url('assets/backgrounds/clock.jpg')"><div class="sceneSoft"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div class="challenge" style="width:min(92%,760px)">${ref}<div class="prompt">${prompt}</div><div class="choices equalChoices">${shuffle(choices).map((c,idx)=>`<button class="choice same" id="clock${idx}" onclick="chooseClock('${c.replace(/'/g,"\\'")}', '${ans.replace(/'/g,"\\'")}', ${idx})">${c}</button>`).join('')}</div><div class="msg" id="clockMsg"></div></div></div></div></div>`}
function chooseClock(c,ans,idx){if(c===ans){addCoin(1);clk.q++;if(clk.q>=clk.qs.length)markComplete('clock',clk.i);else {clk.attempts=0;renderClock()}}else{clk.attempts++;$('clockMsg').textContent=clk.attempts>=2?'Use the calendar clue.':'Try again!';let b=$('clock'+idx);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(clk.attempts>=2)$$('.choice').forEach(x=>{if(x.textContent.trim()===ans)x.classList.add('hint')})}}
function showParent(){let code=prompt('Enter Parent Portal Code');if(code!=='0000')return alert('Incorrect code');setBg('home.jpg');$('layer').innerHTML=`<div class="panel"><h1>Parent Portal</h1><p>Progress is saved on this device.</p><button class="btn" onclick="state=structuredClone(defaultState);save();showHome()">Reset progress</button> <button class="btn" onclick="Object.keys(state.unlocked).forEach(k=>state.unlocked[k]=20);save();showHome()">Unlock all levels</button> <button class="btn" onclick="showHome()">Back</button></div>`}
showHome();updateTop();
</script></body></html>
